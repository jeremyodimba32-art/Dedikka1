<style>
﻿*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --rose-1: #fff1f6;
  --rose-2: #ffbfd4;
  --rose-3: #ff8fb2;
  --rose-4: #ff5e93;
  --wine-1: #1d0717;
  --wine-2: #3a0f2a;
  --wine-3: #6d1f44;
  --panel-bg: rgba(44, 8, 29, 0.62);
  --panel-border: rgba(255, 185, 211, 0.28);
  --text-main: #fff7fb;
  --text-soft: rgba(255, 234, 243, 0.78);
}

body {
  overflow: hidden;
  color: var(--text-main);
  font-family: "Nunito Sans", "Segoe UI", sans-serif;
  background:
    radial-gradient(1200px 700px at 50% -120px, rgba(255, 110, 164, 0.22) 0%, transparent 65%),
    radial-gradient(900px 500px at 12% 25%, rgba(255, 170, 210, 0.08) 0%, transparent 68%),
    radial-gradient(900px 500px at 88% 82%, rgba(255, 120, 180, 0.12) 0%, transparent 66%),
    linear-gradient(160deg, #0c0210 0%, #17061a 35%, #290c22 62%, #190815 100%);
}

body::before,
body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  z-index: 2;
  width: 340px;
  height: 340px;
  border-radius: 50%;
  filter: blur(44px);
}

body::before {
  top: -120px;
  left: -90px;
  background: rgba(255, 120, 180, 0.2);
}

body::after {
  bottom: -130px;
  right: -90px;
  background: rgba(255, 175, 205, 0.14);
}

#canvas-container {
  width: 100vw;
  height: 100vh;
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

/* Loader */
#loader {
  position: fixed;
  inset: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  background:
    radial-gradient(550px 300px at 50% 45%, rgba(255, 120, 170, 0.2) 0%, transparent 72%),
    linear-gradient(170deg, #170715 0%, #10020d 100%);
  transition: opacity 0.8s ease;
}

#loader.hidden {
  opacity: 0;
  pointer-events: none;
}

#loader p {
  color: var(--rose-1);
  letter-spacing: 0.03em;
  font-size: 18px;
}

#start-overlay {
  position: fixed;
  inset: 0;
  z-index: 25;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.1s ease;
  background:
    radial-gradient(520px 260px at 50% 52%, rgba(255, 128, 180, 0.12) 0%, transparent 75%),
    linear-gradient(180deg, rgba(22, 5, 14, 0.38) 0%, rgba(22, 5, 14, 0.52) 100%);
}

#start-overlay.is-visible {
  opacity: 1;
  pointer-events: auto;
}

#start-card {
  width: min(480px, calc(100% - 28px));
  padding: 24px 20px;
  text-align: center;
  border-radius: 18px;
  background: rgba(58, 13, 37, 0.5);
  border: 1px solid rgba(255, 189, 215, 0.34);
  box-shadow: 0 16px 34px rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(8px);
  opacity: 0;
  transform: translateY(56px) scale(0.97);
  transition: transform 1.25s ease, opacity 1.25s ease;
}

#start-kicker {
  font-family: "Nunito Sans", "Segoe UI", sans-serif;
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(255, 225, 240, 0.8);
  opacity: 0;
  transform: translateY(24px);
}

#start-title {
  margin-top: 10px;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(30px, 5vw, 44px);
  line-height: 1.1;
  color: #ffe4f0;
  opacity: 0;
  transform: translateY(24px);
}

#start-button {
  margin-top: 16px;
  min-width: 170px;
  height: 46px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff5e96 0%, #ff8a7a 100%);
  color: #fffafc;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.03em;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(255, 94, 150, 0.34);
  transition: transform 0.18s ease, filter 0.18s ease;
  opacity: 0;
  transform: translateY(26px);
}

#start-button:hover {
  transform: translateY(-1px);
  filter: brightness(1.06);
}

#start-button:active {
  transform: translateY(0);
}

#start-overlay.is-visible #start-card {
  opacity: 1;
  transform: translateY(0) scale(1);
}

#start-overlay.is-visible #start-kicker,
#start-overlay.is-visible #start-title,
#start-overlay.is-visible #start-button {
  animation: startRiseIn 1.35s ease forwards;
}

#start-overlay.is-visible #start-kicker {
  animation-delay: 0.28s;
}

#start-overlay.is-visible #start-title {
  animation-delay: 0.52s;
}

#start-overlay.is-visible #start-button {
  animation-delay: 0.76s;
}

@keyframes startRiseIn {
  from {
    opacity: 0;
    transform: translateY(26px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

body.start-screen-active #app-title,
body.start-screen-active #app-subtitle,
body.start-screen-active #route-panel,
body.start-screen-active #route-status,
body.start-screen-active #mobile-panzoom-hint,
body.start-screen-active #fullscreen-control,
body.start-screen-active #music-control,
body.start-screen-active #letter-modal {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

body.start-screen-active #app-title,
body.start-screen-active #app-subtitle,
body.start-screen-active #route-panel,
body.start-screen-active #route-status {
  transform: translateX(-50%) translateY(18px);
}

body.start-screen-active #fullscreen-control,
body.start-screen-active #music-control {
  transform: translateY(18px);
}

body.start-screen-active #letter-fab {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transform: translateX(-50%) translateY(18px);
}

#app-title,
#app-subtitle,
#route-panel,
#route-status,
#mobile-panzoom-hint,
#fullscreen-control,
#music-control,
#letter-fab,
#letter-modal {
  transition: opacity 0.3s ease, visibility 0.3s ease, transform 0.3s ease;
}

@keyframes uiRiseInCentered {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(34px);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
}

@keyframes uiFabRiseIn {
  from {
    opacity: 0;
    transform: translateX(-50%) translateY(38px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
  }
}

body.ui-reveal-active #app-title {
  animation: uiRiseInCentered 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) both;
}

body.ui-reveal-active #app-subtitle {
  animation: uiRiseInCentered 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.18s both;
}

body.ui-reveal-active #route-panel {
  animation: uiRiseInCentered 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) 0.34s both;
}

body.ui-reveal-active #letter-fab {
  animation:
    uiFabRiseIn 1.2s cubic-bezier(0.22, 0.61, 0.36, 1) both,
    letterBeat 1.9s ease-in-out 1.2s infinite;
}

.spinner {
  width: 52px;
  height: 52px;
  border: 3px solid rgba(255, 218, 235, 0.22);
  border-top-color: var(--rose-3);
  border-right-color: var(--rose-2);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

#error-banner {
  display: none;
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 26;
  background: rgba(142, 20, 63, 0.92);
  color: #ffeaf3;
  border: 1px solid rgba(255, 194, 221, 0.35);
  box-shadow: 0 14px 28px rgba(0, 0, 0, 0.32);
  padding: 10px 18px;
  border-radius: 14px;
  font-size: 13px;
  backdrop-filter: blur(5px);
}

/* UI */
#app-title {
  position: fixed;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(34px, 5vw, 52px);
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.06em;
  color: #ffdbe9;
  text-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
  pointer-events: none;
  animation: titleFloat 5.4s ease-in-out infinite;
  text-align: center;
  white-space: nowrap;
}

#app-subtitle {
  position: fixed;
  top: 58px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(16px, 2.2vw, 22px);
  letter-spacing: 0.08em;
  color: var(--text-soft);
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
}

@keyframes titleFloat {
  0%,
  100% {
    transform: translateX(-50%) translateY(0);
  }
  50% {
    transform: translateX(-50%) translateY(-4px);
  }
}

#route-panel {
  position: fixed;
  top: 102px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 18;
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: center;
  width: min(980px, calc(100% - 24px));
  padding: 12px;
  border-radius: 16px;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
  backdrop-filter: blur(10px);
}

#city-input-wrap {
  position: relative;
  flex: 1;
  min-width: 220px;
}

#city-input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border-radius: 12px;
  background: rgba(255, 220, 236, 0.08);
  color: var(--text-main);
  border: 1px solid rgba(255, 193, 219, 0.26);
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}

#city-input::placeholder {
  color: rgba(255, 221, 236, 0.6);
}

#city-input:focus {
  border-color: rgba(255, 169, 202, 0.66);
  box-shadow: 0 0 0 3px rgba(255, 122, 177, 0.18);
  background: rgba(255, 220, 236, 0.12);
}

#city-suggestions {
  display: none;
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  width: 100%;
  max-height: 235px;
  overflow-y: auto;
  z-index: 24;
  border-radius: 12px;
  background: rgba(53, 11, 34, 0.94);
  border: 1px solid rgba(255, 191, 215, 0.34);
  box-shadow: 0 16px 30px rgba(0, 0, 0, 0.35);
  backdrop-filter: blur(10px);
}

#city-suggestions.open {
  display: block;
}

.city-suggestion {
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255, 182, 212, 0.16);
  transition: background 0.15s ease;
}

.city-suggestion:last-child {
  border-bottom: none;
}

.city-suggestion:hover,
.city-suggestion.is-active {
  background: rgba(255, 132, 184, 0.18);
}

.city-suggestion-title {
  display: block;
  font-size: 14px;
  font-weight: 700;
  color: #fff3f8;
}

.city-suggestion-meta {
  display: block;
  margin-top: 2px;
  font-size: 12px;
  color: rgba(255, 224, 239, 0.75);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

button {
  height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  cursor: pointer;
  border: 1px solid transparent;
  font-family: "Nunito Sans", "Segoe UI", sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.02em;
  transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.2s ease;
}

button:hover:not(:disabled) {
  transform: translateY(-1px);
  filter: brightness(1.05);
}

button:active:not(:disabled) {
  transform: translateY(0);
}

#animate-btn {
  background: linear-gradient(135deg, #ff4a8c 0%, #ff6f7e 45%, #ff8a6a 100%);
  color: #fff7fb;
  border: none;
  box-shadow: 0 8px 18px rgba(255, 89, 146, 0.34);
}

#clear-btn {
  background: rgba(255, 216, 233, 0.1);
  border: 1px solid rgba(255, 191, 215, 0.35);
  color: #ffe4ef;
}

#clear-btn:disabled,
#animate-btn:disabled {
  opacity: 0.56;
  cursor: not-allowed;
  transform: none;
  filter: none;
  box-shadow: none;
}

#route-status {
  display: none;
  position: fixed;
  top: 166px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 18;
  font-size: 13px;
  color: rgba(255, 236, 245, 0.95);
  background: rgba(79, 18, 46, 0.7);
  border: 1px solid rgba(255, 184, 212, 0.3);
  padding: 8px 14px;
  border-radius: 12px;
  backdrop-filter: blur(6px);
}

#mobile-panzoom-hint {
  display: none;
  position: fixed;
  left: 50%;
  bottom: 8px;
  transform: translateX(-50%);
  z-index: 18;
  font-size: 11px;
  letter-spacing: 0.03em;
  color: rgba(255, 240, 247, 0.9);
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
  background: rgba(66, 18, 44, 0.46);
  border: 1px solid rgba(255, 190, 220, 0.36);
  border-radius: 999px;
  padding: 6px 12px;
  backdrop-filter: blur(6px);
  pointer-events: none;
  white-space: nowrap;
}

.fullscreen-control {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 22;
}

.fullscreen-btn {
  width: 50px;
  height: 50px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #6b2747 0%, #8f2f5e 100%);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.42);
  transition: transform 0.26s ease, box-shadow 0.26s ease, filter 0.26s ease;
}

.fullscreen-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 20px rgba(168, 71, 120, 0.45);
}

.fullscreen-btn:active {
  transform: scale(0.95);
}

.fullscreen-btn svg {
  width: 28px;
  height: 28px;
  fill: #fff;
}

#fullscreenExitIcon {
  width: 24px;
  height: 24px;
}

.music-control {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 22;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.music-btn {
  width: 50px;
  height: 50px;
  padding: 0;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #ff4d6d, #e6395c);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
  transition: transform 0.3s ease, box-shadow 0.3s ease, filter 0.3s ease;
}

.music-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
}

.music-btn:active {
  transform: scale(0.95);
}

.music-btn svg {
  width: 24px;
  height: 24px;
  fill: #fff;
}

.volume-control {
  width: 120px;
  background: rgba(255, 255, 255, 0.15);
  padding: 10px;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 77, 109, 0.5);
  margin-top: 10px;
  display: none;
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.3s ease, transform 0.3s ease;
}

.volume-control.visible {
  display: block;
  opacity: 1;
  transform: translateY(0);
}

.volume-control input {
  width: 100%;
  height: 8px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 4px;
  outline: none;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
}

.volume-control input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  background: #ff4d6d;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
}

.volume-control input::-moz-range-thumb {
  width: 16px;
  height: 16px;
  background: #ff4d6d;
  border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  border: none;
}

#letter-fab {
  position: fixed;
  left: 50%;
  bottom: 18px;
  z-index: 19;
  width: 86px;
  height: 86px;
  padding: 0;
  border: none;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
  appearance: none;
  display: grid;
  place-items: center;
  animation: letterBeat 1.9s ease-in-out infinite;
}

#letter-fab img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: contain;
  border-radius: 0;
  filter:
    drop-shadow(0 8px 14px rgba(0, 0, 0, 0.34))
    drop-shadow(0 0 14px rgba(255, 120, 168, 0.33));
}

#letter-fab:focus-visible {
  outline: none;
}

#letter-fab:focus-visible img {
  filter:
    drop-shadow(0 8px 14px rgba(0, 0, 0, 0.34))
    drop-shadow(0 0 16px rgba(255, 184, 212, 0.72));
}

#letter-modal {
  position: fixed;
  inset: 0;
  z-index: 27;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 12px;
  opacity: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(18, 5, 14, 0.22) 0%, rgba(18, 5, 14, 0.62) 100%);
  transition: opacity 0.3s ease;
}

#letter-modal.is-open {
  opacity: 1;
  pointer-events: auto;
}

#letter-sheet {
  position: relative;
  width: min(560px, calc(100% - 8px));
  max-height: calc(100vh - 36px);
  overflow-y: auto;
  padding: 22px 20px 18px;
  border-radius: 18px;
  background:
    radial-gradient(180px 90px at 18% 10%, rgba(255, 205, 226, 0.35) 0%, transparent 85%),
    linear-gradient(175deg, rgba(255, 244, 250, 0.98) 0%, rgba(255, 236, 246, 0.97) 100%);
  border: 1px solid rgba(255, 184, 212, 0.55);
  box-shadow: 0 18px 36px rgba(0, 0, 0, 0.34);
  color: #5b2140;
  transform: translateY(28px) scale(0.985);
  transition: transform 0.32s ease, opacity 0.32s ease;
  opacity: 0;
}

#letter-modal.is-open #letter-sheet {
  transform: translateY(0) scale(1);
  opacity: 1;
}

#letter-close {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 34px;
  height: 34px;
  border-radius: 999px;
  border: 1px solid rgba(168, 33, 93, 0.45);
  background: rgba(255, 255, 255, 0.9);
  color: #b01e61;
  font-size: 24px;
  line-height: 1;
  font-weight: 700;
  cursor: pointer;
  padding: 0;
  box-shadow: 0 6px 14px rgba(128, 22, 70, 0.18);
}

#letter-close:hover {
  filter: brightness(1.08);
}

#letter-kicker {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: rgba(91, 33, 64, 0.66);
}

#letter-title {
  margin: 8px auto 0;
  font-family: "Cormorant Garamond", serif;
  font-size: clamp(30px, 5vw, 40px);
  line-height: 1.1;
  color: #5a193d;
  text-align: center;
}

#letter-message {
  margin-top: 12px;
  font-size: clamp(15px, 2.5vw, 17px);
  line-height: 1.75;
  color: #6c2a4b;
}

#letter-photo-wrap {
  margin-top: 16px;
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border-radius: 14px;
  border: 1px solid rgba(255, 184, 212, 0.45);
  box-shadow: 0 10px 20px rgba(109, 31, 68, 0.17);
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

#letter-photo-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: blur(18px) brightness(0.6) saturate(1.3);
  transform: scale(1.1);
  border-radius: 14px;
}

#letter-photo {
  position: relative;
  z-index: 1;
  max-width: 100%;
  height: 100%;
  width: auto;
  object-fit: contain;
  border-radius: 10px;
}

#letter-modal.is-sequencing #letter-title,
#letter-modal.is-sequencing #letter-photo-wrap,
#letter-modal.is-sequencing #letter-message {
  opacity: 0;
  transform: translateY(14px);
  visibility: hidden;
  transition: none;
  will-change: opacity, transform;
}

#letter-modal.is-sequencing #letter-title.is-visible,
#letter-modal.is-sequencing #letter-photo-wrap.is-visible,
#letter-modal.is-sequencing #letter-message.is-visible {
  visibility: visible;
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.48s ease, transform 0.48s ease;
}

#letter-modal.is-sequencing #letter-message {
  min-height: 5.5em;
}

#letter-modal.is-sequencing #letter-message.is-typing::after {
  content: "|";
  margin-left: 2px;
  color: #b33b72;
  animation: letterCaretBlink 0.85s step-end infinite;
}

@keyframes letterCaretBlink {
  50% {
    opacity: 0;
  }
}

@keyframes letterBeat {
  0%,
  100% {
    transform: translateX(-50%) scale(1);
  }
  14% {
    transform: translateX(-50%) scale(1.11);
  }
  28% {
    transform: translateX(-50%) scale(1);
  }
  42% {
    transform: translateX(-50%) scale(1.08);
  }
  58% {
    transform: translateX(-50%) scale(1);
  }
}

  return window.innerWidth <= MOBILE_PLANET_BREAKPOINT ? 4.25 : 3.5;
}

function getRendererPixelRatio() {
  const cap =
    window.innerWidth <= MOBILE_PLANET_BREAKPOINT
      ? RENDERER_PIXEL_RATIO_MAX_MOBILE
      : RENDERER_PIXEL_RATIO_MAX_DESKTOP;
  return Math.min(window.devicePixelRatio || 1, cap);
}

function getDynamicPixelRatio(cameraDistance) {
  const baseRatio = getRendererPixelRatio();
  const nearBoost = THREE.MathUtils.clamp(
    (ZOOM_SUPERSAMPLE_FAR_DISTANCE - cameraDistance) /
      (ZOOM_SUPERSAMPLE_FAR_DISTANCE - ZOOM_SUPERSAMPLE_NEAR_DISTANCE),
    0,
    1
  );
  const boostedRatio = baseRatio * (1 + nearBoost * (ZOOM_SUPERSAMPLE_STRENGTH - 1));
  const maxRatio =
    window.innerWidth <= MOBILE_PLANET_BREAKPOINT
      ? ZOOM_SUPERSAMPLE_MAX_MOBILE
      : ZOOM_SUPERSAMPLE_MAX_DESKTOP;
  return Math.min(boostedRatio, maxRatio);
}

function getViewportOrbitRadius() {
  return window.innerWidth <= MOBILE_PLANET_BREAKPOINT ? 3.0 : 2.6;
}

function getRouteOrbitRadiusForAngle(angleRad, baseOrbitRadius) {
  const shortRouteT = THREE.MathUtils.clamp(
    (angleRad - VERY_CLOSE_ROUTE_ANGLE_RAD) /
      (CLOSE_ROUTE_ANGLE_RAD - VERY_CLOSE_ROUTE_ANGLE_RAD),
    0,
    1
  );
  const minRatioForAngle = THREE.MathUtils.lerp(
    VERY_CLOSE_ROUTE_ORBIT_RATIO,
    CLOSE_ROUTE_ORBIT_RATIO,
    shortRouteT
  );

  const t = THREE.MathUtils.clamp(
    (angleRad - CLOSE_ROUTE_ANGLE_RAD) /
      (NORMAL_ROUTE_ANGLE_RAD - CLOSE_ROUTE_ANGLE_RAD),
    0,
    1
  );
  const easedT = t * t * (3 - 2 * t);
  return THREE.MathUtils.lerp(
    baseOrbitRadius * minRatioForAngle,
    baseOrbitRadius,
    easedT
  );
}

function createStarfield() {
  const count = 6000;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 80 + Math.random() * 120;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geom = new THREE.BufferGeometry();
  geom.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.15,
    sizeAttenuation: true
  });
  scene.add(new THREE.Points(geom, mat));
}

const texLoader = new THREE.TextureLoader();
const TEXTURE_TIMEOUT_MS = 12000;
const DAY_TEXTURE_TIMEOUT_MS = 32000;
const JSON_TIMEOUT_MS = 12000;
const NON_COLOR_SPACE =
  typeof THREE.NoColorSpace !== "undefined"
    ? THREE.NoColorSpace
    : THREE.LinearSRGBColorSpace;

function loadTexture(
  url,
  colorSpace = THREE.SRGBColorSpace,
  timeoutMs = TEXTURE_TIMEOUT_MS
) {
  return new Promise((resolve, reject) => {
    let settled = false;
    const timeoutId = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error(`Texture load timeout after ${timeoutMs}ms: ${url}`));
    }, timeoutMs);

    texLoader.load(
      url,
      (tex) => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        tex.colorSpace = colorSpace;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        tex.generateMipmaps = true;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.needsUpdate = true;
        resolve(tex);
      },
      undefined,
      () => {
        if (settled) return;
        settled = true;
        clearTimeout(timeoutId);
        reject(new Error(`Failed to load texture: ${url}`));
      }
    );
  });
}

async function loadFirstAvailableTexture(
  urls,
  colorSpace = THREE.SRGBColorSpace,
  timeoutMs = TEXTURE_TIMEOUT_MS
) {
  let lastError = null;
  for (const url of urls) {
    try {
      return await loadTexture(url, colorSpace, timeoutMs);
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError || new Error("No texture URL available.");
}

async function loadOptionalTexture(
  urls,
  colorSpace = THREE.SRGBColorSpace,
  timeoutMs = TEXTURE_TIMEOUT_MS
) {
  if (!Array.isArray(urls) || urls.length === 0) return null;

  let lastError = null;
  for (const url of urls) {
    try {
      return await loadTexture(url, colorSpace, timeoutMs);
    } catch (err) {
      lastError = err;
    }
  }

  if (lastError) {
    console.warn("Optional texture unavailable:", lastError.message || lastError);
  }
  return null;
}

async function loadJson(url) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), JSON_TIMEOUT_MS);
  try {
    const response = await fetch(url, { signal: controller.signal });
    if (!response.ok) {
      throw new Error(`JSON request failed (HTTP ${response.status}): ${url}`);
    }
    return await response.json();
  } finally {
    clearTimeout(timeoutId);
  }
}

async function loadFirstAvailableJson(urls) {
  let lastError = null;
  for (const url of urls) {
    try {
      return await loadJson(url);
    } catch (err) {
      lastError = err;
    }
  }
  throw lastError || new Error("No JSON URL available.");
}

function isLetterModalOpen() {

}

function clearLetterAutoOpenTimer() {
  if (letterAutoOpenTimer) {
    clearTimeout(letterAutoOpenTimer);
    letterAutoOpenTimer = null;
  }
}

function clearLetterSequenceTimers() {
  if (letterTypingTimer) {
    clearTimeout(letterTypingTimer);
    letterTypingTimer = null;
  }

  if (letterSequenceTimers.length > 0) {
    for (const timer of letterSequenceTimers) {
      clearTimeout(timer);
    }
    letterSequenceTimers = [];
  }
}

function resetLetterSequenceVisualState() {
  if (!letterModal) return;

  clearLetterSequenceTimers();
  letterModal.classList.remove("is-sequencing");
  letterTitle?.classList.remove("is-visible");
  letterPhotoWrap?.classList.remove("is-visible");
  letterMessage?.classList.remove("is-visible", "is-typing");

  if (letterMessage) {
    letterMessage.textContent = LETTER_MESSAGE_SOURCE_TEXT;
  }
}

function runLetterTypingAnimation(text) {
  if (!letterMessage) return;

  clearLetterSequenceTimers();
  letterMessage.textContent = "";
  letterMessage.classList.add("is-visible", "is-typing");

  let index = 0;
  const step = () => {
    if (!isLetterModalOpen() || !letterMessage) {
      letterTypingTimer = null;
      return;
    }

    if (index >= text.length) {
      letterMessage.classList.remove("is-typing");
      letterTypingTimer = null;
      return;
    }

    const nextChar = text[index];
    letterMessage.textContent += nextChar;
    index++;

    const delay = /[.,;:!?]/.test(nextChar)
      ? LETTER_TYPING_PUNCT_DELAY_MS
      : LETTER_TYPING_BASE_DELAY_MS;
    letterTypingTimer = setTimeout(step, delay);
  };

  letterTypingTimer = setTimeout(step, LETTER_TYPING_BASE_DELAY_MS);
}

function runLetterSequenceAnimation() {
  if (!letterModal) return;

  clearLetterSequenceTimers();
  letterModal.classList.add("is-sequencing");
  letterTitle?.classList.remove("is-visible");
  letterPhotoWrap?.classList.remove("is-visible");
  letterMessage?.classList.remove("is-visible", "is-typing");
  if (letterMessage) letterMessage.textContent = "";

  letterSequenceTimers.push(
    setTimeout(() => {
      if (!isLetterModalOpen()) return;
      letterTitle?.classList.add("is-visible");
    }, LETTER_STAGE_TITLE_DELAY_MS)
  );

  letterSequenceTimers.push(
    setTimeout(() => {
      if (!isLetterModalOpen()) return;
      letterPhotoWrap?.classList.add("is-visible");
    }, LETTER_STAGE_PHOTO_DELAY_MS)
  );

  letterSequenceTimers.push(
    setTimeout(() => {
      if (!isLetterModalOpen()) return;
      runLetterTypingAnimation(LETTER_MESSAGE_SOURCE_TEXT);
    }, LETTER_STAGE_TEXT_DELAY_MS)
  );
}

function scheduleLetterAutoOpen() {
  if (!letterModal) return;

  clearLetterAutoOpenTimer();
  letterAutoOpenTimer = setTimeout(() => {
    letterAutoOpenTimer = null;
    if (!isLetterModalOpen()) {
      openLetterModal();
    }
  }, LETTER_AUTO_OPEN_DELAY_MS);
}

function openLetterModal() {
  if (!letterModal) return;

  clearLetterAutoOpenTimer();
  hideCitySuggestions();
  runLetterSequenceAnimation();
  void letterModal.offsetWidth;
  letterModal.classList.add("is-open");
  letterModal.setAttribute("aria-hidden", "false");
}

function closeLetterModal() {
  if (!letterModal) return;

  clearLetterAutoOpenTimer();
  letterModal.classList.remove("is-open");
  letterModal.setAttribute("aria-hidden", "true");
  resetLetterSequenceVisualState();
}

function initMusicControl() {
  if (!backgroundMusic || !musicBtn || !volumeSlider || !volumeControl) return;

  const initialVolume = Number(volumeSlider.value);
  backgroundMusic.volume = Number.isFinite(initialVolume) ? initialVolume : 0.5;
  backgroundMusic.load();
  syncMusicIcons(false);

  playMusic();

  musicBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    toggleMusic();

    if (volumeControl.classList.contains("visible")) {
      hideMusicVolumeControl();
    } else {
      showMusicVolumeControlTemporarily();
    }
  });

  volumeSlider.addEventListener("input", (event) => {
    const volume = Number(event.target.value);
    backgroundMusic.volume = Number.isFinite(volume) ? volume : backgroundMusic.volume;
    if (hideVolumeTimeout) clearTimeout(hideVolumeTimeout);
    volumeControl.classList.add("visible");
  });

  volumeSlider.addEventListener("change", () => {
    showMusicVolumeControlTemporarily();
  });

  volumeControl.addEventListener("mouseenter", () => {
    if (hideVolumeTimeout) {
      clearTimeout(hideVolumeTimeout);
      hideVolumeTimeout = null;
    }
  });

  volumeControl.addEventListener("mouseleave", () => {
    showMusicVolumeControlTemporarily();
  });

  volumeSlider.addEventListener("touchstart", (event) => {
    event.stopPropagation();
    if (hideVolumeTimeout) {
      clearTimeout(hideVolumeTimeout);
      hideVolumeTimeout = null;
    }
  });

  volumeSlider.addEventListener("touchend", () => {
    showMusicVolumeControlTemporarily();
  });

  document.addEventListener("click", (event) => {
    if (!volumeControl.contains(event.target) && !musicBtn.contains(event.target)) {
      hideMusicVolumeControl();
    }
  });

  backgroundMusic.addEventListener("play", () => syncMusicIcons(true));
  backgroundMusic.addEventListener("pause", () => syncMusicIcons(false));
}

function getFullscreenElement() {
  return (
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.msFullscreenElement ||
    null
  );
}

function isFullscreenSupported() {
  return Boolean(
    document.fullscreenEnabled ||
      document.webkitFullscreenEnabled ||
      document.msFullscreenEnabled ||
      document.documentElement.requestFullscreen ||
      document.documentElement.webkitRequestFullscreen ||
      document.documentElement.msRequestFullscreen
  );
}

function syncFullscreenButtonState() {
  if (!fullscreenBtn || !fullscreenEnterIcon || !fullscreenExitIcon) return;

  const active = !!getFullscreenElement();
  fullscreenEnterIcon.style.display = active ? "none" : "block";
  fullscreenExitIcon.style.display = active ? "block" : "none";
  const label = active
    ? "Quitter le plein écran"
    : "Passer en plein écran";
  fullscreenBtn.setAttribute("aria-label", label);
  fullscreenBtn.title = label;
}

async function toggleFullscreen() {
  const activeElement = getFullscreenElement();
  try {
    if (activeElement) {
      const exitFn =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.msExitFullscreen;
      if (exitFn) {
        await exitFn.call(document);
      }
    } else {
      const requestFn =
        document.documentElement.requestFullscreen ||
        document.documentElement.webkitRequestFullscreen ||
        document.documentElement.msRequestFullscreen;
      if (requestFn) {
        await requestFn.call(document.documentElement);
      }
    }
  } catch {
    showError("Impossible de changer le mode plein écran.");
  } finally {
    syncFullscreenButtonState();
  }
}

function initFullscreenControl() {
  const fullscreenControl = document.getElementById("fullscreen-control");
  if (!fullscreenBtn || !fullscreenControl) return;

  if (!isFullscreenSupported()) {
    fullscreenControl.style.display = "none";
    return;
  }

  syncFullscreenButtonState();

  fullscreenBtn.addEventListener("click", (event) => {
    event.stopPropagation();
    toggleFullscreen();
  });

  document.addEventListener("fullscreenchange", syncFullscreenButtonState);
  document.addEventListener("webkitfullscreenchange", syncFullscreenButtonState);
  document.addEventListener("msfullscreenchange", syncFullscreenButtonState);
}
