const GLOBE_RADIUS = 1;
const GLOBE_SEGMENTS = 128;
const CLOUD_ROTATION_SPEED = 0.014;
const globeGroup = new THREE.Group();
scene.add(globeGroup);

const routeGroup = new THREE.Group();
globeGroup.add(routeGroup);
let earthCloudLayer = null;
let atmosphereLayer = null;
let earthMaterial = null;
let countryBorderHaloMaterial = null;
let countryBorderMainMaterial = null;
let countryBorderHaloLines = null;

function appendRingBorderSegments(ringCoords, radius, outPositions) {
  if (!Array.isArray(ringCoords) || ringCoords.length < 2) return;

  const stride =
    ringCoords.length > 900 ? 3 :
    ringCoords.length > 360 ? 2 : 1;

  let first = null;
  let prev = null;

  for (let i = 0; i < ringCoords.length; i += stride) {
    const coord = ringCoords[i];
    if (!Array.isArray(coord) || coord.length < 2) continue;

    const lon = Number(coord[0]);
    const lat = Number(coord[1]);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

    const current = latLonToVec3(lat, lon, radius);
    if (!first) first = current;

    if (prev) {
      outPositions.push(
        prev.x, prev.y, prev.z,
        current.x, current.y, current.z
      );
    }
    prev = current;
  }

  if (prev && first && prev.distanceToSquared(first) > 1e-8) {
    outPositions.push(
      prev.x, prev.y, prev.z,
      first.x, first.y, first.z
    );
  }
}

function createCountryBordersLines(geojson) {
  const features = Array.isArray(geojson?.features) ? geojson.features : null;
  if (!features || features.length === 0) return null;

  const haloPositions = [];
  const mainPositions = [];

  for (const feature of features) {
    const geometry = feature?.geometry;
    if (!geometry || !geometry.type || !Array.isArray(geometry.coordinates)) continue;

    if (geometry.type === "Polygon") {
      for (const ring of geometry.coordinates) {
        appendRingBorderSegments(ring, GLOBE_RADIUS + 0.0032, haloPositions);
        appendRingBorderSegments(ring, GLOBE_RADIUS + 0.0042, mainPositions);
      }
      continue;
    }

    if (geometry.type === "MultiPolygon") {
      for (const polygon of geometry.coordinates) {
        if (!Array.isArray(polygon)) continue;
        for (const ring of polygon) {
          appendRingBorderSegments(ring, GLOBE_RADIUS + 0.0032, haloPositions);
          appendRingBorderSegments(ring, GLOBE_RADIUS + 0.0042, mainPositions);
        }
      }
    }
  }

  if (mainPositions.length < 6) return null;

  const bordersGroup = new THREE.Group();

  const haloGeometry = new THREE.BufferGeometry();
  haloGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(haloPositions, 3)
  );
  const haloMaterial = new THREE.LineBasicMaterial({
    color: 0x243a54,
    transparent: true,
    opacity: 0.24,
    depthWrite: false
  });
  const haloLines = new THREE.LineSegments(haloGeometry, haloMaterial);
  haloLines.renderOrder = 3;
  bordersGroup.add(haloLines);

  const mainGeometry = new THREE.BufferGeometry();
  mainGeometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(mainPositions, 3)
  );
  const mainMaterial = new THREE.LineBasicMaterial({
    color: 0xe9f5ff,
    transparent: true,
    opacity: 0.72,
    depthWrite: false
  });
  const mainLines = new THREE.LineSegments(mainGeometry, mainMaterial);
  mainLines.renderOrder = 4;
  bordersGroup.add(mainLines);

  bordersGroup.userData.borderStyle = {
    haloMaterial,
    mainMaterial,
    haloLines
  };

  return bordersGroup;
}

async function buildGlobe() {
  let dayTex;
  try {
    dayTex = await loadFirstAvailableTexture(
      TEXTURES.day,
      THREE.SRGBColorSpace,
      DAY_TEXTURE_TIMEOUT_MS
    );
  } catch {
    showError(
      "Impossible de charger la texture du globe. Vérifie ta connexion."
    );
    const fallback = new THREE.Mesh(
      new THREE.SphereGeometry(GLOBE_RADIUS, GLOBE_SEGMENTS, GLOBE_SEGMENTS),
      new THREE.MeshStandardMaterial({
        color: 0x2255aa
      })
    );
    globeGroup.add(fallback);
    return;
  }

  const [bumpTex, specularTex, cloudTex] = await Promise.all([
    loadOptionalTexture(TEXTURES.bump, NON_COLOR_SPACE),
    loadOptionalTexture(TEXTURES.specular, NON_COLOR_SPACE),
    loadOptionalTexture(TEXTURES.clouds, THREE.SRGBColorSpace)
  ]);

  const earthGeom = new THREE.SphereGeometry(
    GLOBE_RADIUS,
    GLOBE_SEGMENTS,
    GLOBE_SEGMENTS
  );
  // --- Detail texture for close-up zoom quality ---
  const detailTex = (() => {
    const S = 512;
    const c = document.createElement("canvas");
    c.width = S; c.height = S;
    const ctx = c.getContext("2d");
    const img = ctx.createImageData(S, S);
    // Subtle terrain-like noise
    for (let i = 0; i < img.data.length; i += 4) {
      const x = (i / 4) % S, y = (i / 4) / S | 0;
      const n1 = Math.sin(x * 0.12) * Math.cos(y * 0.15) * 18;
      const n2 = Math.sin(x * 0.37 + y * 0.29) * 12;
      const n3 = (Math.random() - 0.5) * 16;
      const v = 128 + n1 + n2 + n3;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.minFilter = THREE.LinearMipmapLinearFilter;
    t.magFilter = THREE.LinearFilter;
    t.generateMipmaps = true;
    return t;
  })();

  const earthMat = new THREE.MeshPhongMaterial({
    map: dayTex,
    bumpMap: bumpTex || null,
    bumpScale: bumpTex ? 0.028 : 0,
    specularMap: specularTex || null,
    specular: new THREE.Color(0x304964),
    shininess: specularTex ? 14 : 8
  });

  // Inject tiling detail texture into the shader for close-up quality
  earthMat.userData.detailTex = detailTex;
  earthMat.onBeforeCompile = (shader) => {
    shader.uniforms.detailMap = { value: detailTex };
    shader.uniforms.detailBlend = { value: 0.0 };
    earthMat.userData.shader = shader;

    // Add uniform declarations after existing ones
    shader.fragmentShader = shader.fragmentShader.replace(
      "void main() {",
      `uniform sampler2D detailMap;
uniform float detailBlend;
void main() {`
    );

    // Blend detail texture with diffuse color after map sampling
    shader.fragmentShader = shader.fragmentShader.replace(
      "#include <map_fragment>",
      `#include <map_fragment>
{
  // Tiling detail texture — repeats 60x30 over the sphere
  vec2 detailUV = vMapUv * vec2(60.0, 30.0);
  vec3 detail = texture2D(detailMap, detailUV).rgb;
  // Overlay blend: adds subtle terrain variation
  float blend = detailBlend;
  diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * (detail * 0.6 + 0.7), blend);
}`
    );
  };

  earthMaterial = earthMat;
  const earthMesh = new THREE.Mesh(earthGeom, earthMat);
  globeGroup.add(earthMesh);

  const atmosphereGeom = new THREE.SphereGeometry(
    GLOBE_RADIUS * 1.04,
    GLOBE_SEGMENTS,
    GLOBE_SEGMENTS
  );
  const atmosphereMat = new THREE.MeshLambertMaterial({
    color: 0x87baf8,
    transparent: true,
    opacity: 0.12,
    side: THREE.BackSide,
    depthWrite: false
  });
  const atmosphere = new THREE.Mesh(atmosphereGeom, atmosphereMat);
  atmosphere.renderOrder = 1;
  globeGroup.add(atmosphere);
  atmosphereLayer = atmosphere;

  if (cloudTex) {
    const cloudGeom = new THREE.SphereGeometry(
      GLOBE_RADIUS + 0.012,
      GLOBE_SEGMENTS,
      GLOBE_SEGMENTS
    );
    const cloudMat = new THREE.MeshLambertMaterial({
      map: cloudTex,
      transparent: true,
      opacity: 0.24,
      depthWrite: false
    });
    earthCloudLayer = new THREE.Mesh(cloudGeom, cloudMat);
    earthCloudLayer.renderOrder = 2;
    globeGroup.add(earthCloudLayer);
  }

  try {
    const bordersGeojson = await loadFirstAvailableJson(COUNTRY_BORDERS_GEOJSON_URLS);
    const borderLines = createCountryBordersLines(bordersGeojson);
    if (borderLines) {
      globeGroup.add(borderLines);
      const borderStyle = borderLines.userData?.borderStyle;
      countryBorderHaloMaterial = borderStyle?.haloMaterial || null;
      countryBorderMainMaterial = borderStyle?.mainMaterial || null;
      countryBorderHaloLines = borderStyle?.haloLines || null;
    }
  } catch (err) {
    console.warn("Country borders overlay could not be loaded:", err);
  }
}

// =========================================================================
// GEOCODING — Nominatim (free, no API key)
// =========================================================================
const geocodeCache = new Map();
const citySuggestionCache = new Map();
const SUGGESTION_DEBOUNCE_MS = 260;
let suggestionDebounceTimer = null;
let suggestionAbortController = null;
let suggestionRequestId = 0;
let currentSuggestions = [];
let activeSuggestionIndex = -1;

function normalizePlaceText(value) {
  return (value || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9\s-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function buildPlaceNameCandidates(item) {
  const candidates = [
    item.name,
    item.display_name,
    item.address?.city,
    item.address?.town,
    item.address?.village,
    item.address?.municipality,
    item.address?.county,
    item.address?.state
  ];

  return [...new Set(candidates.filter(Boolean))];
}

function isStrongCityMatch(query, item) {
  const q = normalizePlaceText(query);
  if (!q) return false;

  const tokens = q.split(" ").filter((token) => token.length > 1);
  const names = buildPlaceNameCandidates(item)
    .map((value) => normalizePlaceText(value))
    .filter(Boolean);

  for (const name of names) {
    // Match exacto o frase completa (p.ej. "paris" dentro de "paris france")
    if (
      name === q ||
      name.startsWith(`${q} `) ||
      name.endsWith(` ${q}`) ||
      name.includes(` ${q} `)
    ) {
      return true;
    }

    // Para nombres compuestos, exigimos que casi todos los tokens aparezcan.
    if (tokens.length > 0) {
      const hits = tokens.filter((token) => name.includes(token)).length;
      const ratio = hits / tokens.length;
      if (ratio >= 0.9 && q.length >= 4) {
        return true;
      }
    }
  }

  return false;
}

async function fetchGeocodeCandidates(
  query,
  featureType,
  limit = 5,
  signal = undefined
) {
  const url =
    `https://nominatim.openstreetmap.org/search?` +
    `q=${encodeURIComponent(query)}` +
    `&format=jsonv2&limit=${limit}&addressdetails=1` +
    `&featuretype=${featureType}&accept-language=fr`;

  const res = await fetch(url, { signal });

  if (!res.ok) {
    throw new Error(`Impossible de localiser « ${query} » (HTTP ${res.status})`);
  }

  return res.json();
}

function splitCityInputValue(rawValue) {
  const parts = rawValue.split(",");
  const activeTerm = (parts[parts.length - 1] || "").trim();
  const committedCities = parts
    .slice(0, -1)
    .map((part) => part.trim())
    .filter(Boolean);

  return {
    activeTerm,
    committedCities
  };
}

function getGeocodeCacheKey(value) {
  return normalizePlaceText(value);
}

function sanitizeCityToken(value) {
  return (value || "")
    .replace(/,/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

function buildCitySuggestion(item) {
  const primaryRaw = sanitizeCityToken(
    item.address?.city ||
    item.address?.town ||
    item.address?.village ||
    item.address?.municipality ||
    item.name ||
    item.display_name?.split(",")[0] ||
    ""
  );

  if (!primaryRaw) return null;

  const metaParts = [item.address?.state, item.address?.country]
    .filter(Boolean)
    .map((part) => sanitizeCityToken(part))
    .filter(Boolean);
  const meta = metaParts.join(" - ");
  const value = meta ? `${primaryRaw} (${meta})` : primaryRaw;
  const queryText = [primaryRaw, ...metaParts].join(", ");

  return {
    value,
    title: primaryRaw,
    meta: meta || item.display_name || "",
    queryText,
    cacheResult: {
      name: value,
      lat: parseFloat(item.lat),
      lon: parseFloat(item.lon),
      displayName: item.display_name
    }
  };
}

function hideCitySuggestions() {
  if (suggestionDebounceTimer) {
    clearTimeout(suggestionDebounceTimer);
    suggestionDebounceTimer = null;
  }

  if (suggestionAbortController) {
    suggestionAbortController.abort();
    suggestionAbortController = null;
  }

  suggestionRequestId++;
  currentSuggestions = [];
  activeSuggestionIndex = -1;
  citySuggestions.innerHTML = "";
  citySuggestions.classList.remove("open");
}

function syncActiveSuggestionItem() {
  const nodes = citySuggestions.querySelectorAll(".city-suggestion");
  nodes.forEach((node, idx) => {
    const isActive = idx === activeSuggestionIndex;
    node.classList.toggle("is-active", isActive);
    node.setAttribute("aria-selected", isActive ? "true" : "false");

    if (isActive) {
      node.scrollIntoView({ block: "nearest" });
    }
  });
}

function renderCitySuggestions(suggestions) {
  currentSuggestions = suggestions;
  activeSuggestionIndex = suggestions.length > 0 ? 0 : -1;
  citySuggestions.innerHTML = "";

  if (!suggestions.length) {
    citySuggestions.classList.remove("open");
    return;
  }

  const fragment = document.createDocumentFragment();

  suggestions.forEach((suggestion, idx) => {
    const option = document.createElement("div");
    option.className = "city-suggestion";
    option.dataset.suggestionIndex = String(idx);
    option.setAttribute("role", "option");
    option.setAttribute("aria-selected", idx === activeSuggestionIndex ? "true" : "false");

    const title = document.createElement("span");
    title.className = "city-suggestion-title";
    title.textContent = suggestion.title;
    option.appendChild(title);

    if (suggestion.meta) {
      const meta = document.createElement("span");
      meta.className = "city-suggestion-meta";
      meta.textContent = suggestion.meta;
      option.appendChild(meta);
    }

    fragment.appendChild(option);
  });

  citySuggestions.appendChild(fragment);
  citySuggestions.classList.add("open");
  syncActiveSuggestionItem();
}

async function fetchCitySuggestions(query, signal) {
  const normalizedQuery = normalizePlaceText(query);
  if (normalizedQuery.length < 2) return [];

  if (citySuggestionCache.has(normalizedQuery)) {
    return citySuggestionCache.get(normalizedQuery);
  }

  const [cityResults, settlementResults] = await Promise.all([
    fetchGeocodeCandidates(query, "city", 6, signal).catch((err) => {
      if (err.name === "AbortError") throw err;
      return [];
    }),
    fetchGeocodeCandidates(query, "settlement", 6, signal).catch((err) => {
      if (err.name === "AbortError") throw err;
      return [];
    })
  ]);

  const combined = [...cityResults, ...settlementResults];
  combined.sort(
    (a, b) => Number(isStrongCityMatch(query, b)) - Number(isStrongCityMatch(query, a))
  );

  const suggestions = [];
  const seen = new Set();

  for (const item of combined) {
    const suggestion = buildCitySuggestion(item);
    if (!suggestion) continue;

    const idKey = String(item.place_id || `${item.lat}|${item.lon}`);
    if (seen.has(idKey)) continue;
    const displayKey = `${suggestion.title}|${suggestion.meta}`;
    if (seen.has(displayKey)) continue;

    const titleMatch = normalizePlaceText(suggestion.title).includes(normalizedQuery);
    const metaMatch = normalizePlaceText(suggestion.meta).includes(normalizedQuery);
    const strongMatch = isStrongCityMatch(query, item);
    if (!titleMatch && !metaMatch && !strongMatch) continue;

    seen.add(idKey);
    seen.add(displayKey);
    suggestions.push(suggestion);
    if (suggestions.length >= 6) break;
  }

  citySuggestionCache.set(normalizedQuery, suggestions);
  return suggestions;
}

function applySuggestionSelection(index) {
  const suggestion = currentSuggestions[index];
  if (!suggestion) return false;

  const { committedCities } = splitCityInputValue(cityInput.value);
  cityInput.value = [...committedCities, suggestion.value].join(", ");

  if (suggestion.cacheResult) {
    geocodeCache.set(
      getGeocodeCacheKey(suggestion.value),
      suggestion.cacheResult
    );
  }

  hideCitySuggestions();
  cityInput.focus();
  return true;
}

function moveSuggestionSelection(delta) {
  if (!currentSuggestions.length) return;

  activeSuggestionIndex =
    (activeSuggestionIndex + delta + currentSuggestions.length) % currentSuggestions.length;
  syncActiveSuggestionItem();
}

async function refreshCitySuggestions(queryAtRequestTime) {
  if (suggestionAbortController) {
    suggestionAbortController.abort();
  }

  suggestionAbortController = new AbortController();
  const requestId = ++suggestionRequestId;

  try {
    const suggestions = await fetchCitySuggestions(
      queryAtRequestTime,
      suggestionAbortController.signal
    );

    if (requestId !== suggestionRequestId) return;

    const { activeTerm } = splitCityInputValue(cityInput.value);
    if (normalizePlaceText(activeTerm) !== normalizePlaceText(queryAtRequestTime)) return;

    renderCitySuggestions(suggestions);
  } catch (err) {
    if (err.name === "AbortError") return;
    hideCitySuggestions();
  }
}

function scheduleCitySuggestions() {
  if (suggestionDebounceTimer) {
    clearTimeout(suggestionDebounceTimer);
  }

  const { activeTerm } = splitCityInputValue(cityInput.value);
  if (activeTerm.length < 2) {
    hideCitySuggestions();
    return;
  }

  suggestionDebounceTimer = setTimeout(() => {
    suggestionDebounceTimer = null;
    refreshCitySuggestions(activeTerm);
  }, SUGGESTION_DEBOUNCE_MS);
}

async function geocodeCity(name) {
  const key = getGeocodeCacheKey(name);
  if (geocodeCache.has(key)) return geocodeCache.get(key);

  // The creation form stores a label such as "Paris (Île-de-France - France)".
  // Geocode only the city itself so the exact-name matcher can resolve it.
  const query = name.replace(/\s*\([^)]*\)\s*$/, "").trim();
  if (!query) throw new Error("Saisis le nom d’une ville valide.");

  let data = await fetchGeocodeCandidates(query, "city");
  if (!data.length) {
    data = await fetchGeocodeCandidates(query, "settlement");
  }
  if (!data.length) throw new Error(`Ville introuvable : « ${name} »`);

  const bestMatch = data.find((item) => isStrongCityMatch(query, item));
  if (!bestMatch) {
    throw new Error(
      `Aucune ville correspondante trouvée pour « ${name} ». Essaie un autre nom.`
    );
  }

  const result = {
    name: query,
    lat: parseFloat(bestMatch.lat),
    lon: parseFloat(bestMatch.lon),
    displayName: bestMatch.display_name
  };

  geocodeCache.set(key, result);
  return result;
}

// =========================================================================
// GLOBE MATH — lat/lon to 3D (local space of globeGroup)
// =========================================================================
function latLonToVec3(latDeg, lonDeg, radius = GLOBE_RADIUS) {
  const lat = THREE.MathUtils.degToRad(latDeg);
  const lon = THREE.MathUtils.degToRad(-lonDeg);
  return new THREE.Vector3(
    radius * Math.cos(lat) * Math.cos(lon),
    radius * Math.sin(lat),
    radius * Math.cos(lat) * Math.sin(lon)
  );
}

/**
 * Convert a local-space point (inside globeGroup) to world space.
 * This accounts for globeGroup's rotation from auto-rotate.
 */
function localToWorld(localPoint) {
  return localPoint.clone().applyMatrix4(globeGroup.matrixWorld);
}

// =========================================================================
// EASING FUNCTIONS
// =========================================================================
function easeInOutCubic(t) {
  return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

function easeOutCubic(t) {
  return 1 - Math.pow(1 - t, 3);
}

// =========================================================================
// CURVE GENERATION — great-circle arcs with auto-waypoints
// =========================================================================
const ARC_SEGMENTS = 128;
const ARC_ELEVATION = 0.15;
const MARKER_SURFACE_OFFSET = 0.005;
const ARC_SURFACE_OFFSET = 0.006;
const MIN_ARC_ELEVATION_FACTOR = 0.08;
const SHORT_ROUTE_ANGLE_RAD = THREE.MathUtils.degToRad(2.5);
const LONG_ROUTE_ANGLE_RAD = THREE.MathUtils.degToRad(22);
const MIN_MARKER_SCALE = 0.17;
const MAX_MARKER_SCALE = 1.0;

// When the great-circle arc between two cities would peak above this
// latitude (degrees), the route is split into two legs through an
// auto-generated waypoint at moderate latitude.
const WAYPOINT_LAT_THRESHOLD = 65;

function getMarkerScaleForAngle(angleRad) {
  const t = THREE.MathUtils.clamp(
    (angleRad - SHORT_ROUTE_ANGLE_RAD) /
      (LONG_ROUTE_ANGLE_RAD - SHORT_ROUTE_ANGLE_RAD),
    0,
    1
  );
  return THREE.MathUtils.lerp(MIN_MARKER_SCALE, MAX_MARKER_SCALE, t);
}

function getArcElevationFactor(angleRad) {
  const t = THREE.MathUtils.clamp(
    angleRad / THREE.MathUtils.degToRad(120),
    0,
    1
  );
  return THREE.MathUtils.lerp(MIN_ARC_ELEVATION_FACTOR, 1.0, t);
}

function getLineDrawDurationForAngle(angleRad) {
  const MIN_LINE_DRAW_TIME = 1.9;
  const MAX_LINE_DRAW_TIME = LINE_DRAW_TIME;
  const t = THREE.MathUtils.clamp(
    (angleRad - SHORT_ROUTE_ANGLE_RAD) /
      (LONG_ROUTE_ANGLE_RAD - SHORT_ROUTE_ANGLE_RAD),
    0,
    1
  );
  return THREE.MathUtils.lerp(MIN_LINE_DRAW_TIME, MAX_LINE_DRAW_TIME, t);
}

function snapArcEndpointsToMarkerSurface(points, startDir, endDir) {
  if (!points.length) return;

  const markerRadius = GLOBE_RADIUS + MARKER_SURFACE_OFFSET;
  points[0].copy(startDir).multiplyScalar(markerRadius);
  points[points.length - 1].copy(endDir).multiplyScalar(markerRadius);
}

/**
 * Spherical linear interpolation (slerp) between two unit vectors.
 * Produces uniform spacing along the great-circle arc.
 */
function slerp(a, b, t) {
  const dot = THREE.MathUtils.clamp(a.dot(b), -1, 1);
  const omega = Math.acos(dot);

  if (omega < 1e-6) {
    return new THREE.Vector3().copy(a).lerp(b, t);
  }

  const sinOmega = Math.sin(omega);
  const factorA = Math.sin((1 - t) * omega) / sinOmega;
  const factorB = Math.sin(t * omega) / sinOmega;

  return new THREE.Vector3(
    a.x * factorA + b.x * factorB,
    a.y * factorA + b.y * factorB,
    a.z * factorA + b.z * factorB
  );
}

/**
 * Find the peak latitude (degrees) along a great-circle arc.
 * Samples the arc and returns the maximum absolute latitude reached.
 */
function greatCirclePeakLat(from, to) {
  const start = latLonToVec3(from.lat, from.lon).normalize();
  const end = latLonToVec3(to.lat, to.lon).normalize();
  let maxAbsY = 0;
  for (let i = 0; i <= 32; i++) {
    const p = slerp(start, end, i / 32);
    maxAbsY = Math.max(maxAbsY, Math.abs(p.y));
  }
  return THREE.MathUtils.radToDeg(Math.asin(Math.min(maxAbsY, 1)));
}

/**
 * Compute the shortest signed longitude delta from lonA to lonB.
 * Returns a value in (-180, 180].
 */
function shortestLonDelta(lonA, lonB) {
  let d = lonB - lonA;
  while (d > 180) d -= 360;
  while (d <= -180) d += 360;
  return d;
}

/**
 * Generate a great-circle arc between two lat/lon points.
 * Each point is lifted above the surface with a parabolic elevation.
 */
function generateSimpleArc(fromLatLon, toLatLon, segments = ARC_SEGMENTS) {
  const start = latLonToVec3(fromLatLon.lat, fromLatLon.lon).normalize();
  const end = latLonToVec3(toLatLon.lat, toLatLon.lon).normalize();

  const angle = start.angleTo(end);
  const elevationFactor = getArcElevationFactor(angle);
  const maxElevation = GLOBE_RADIUS * ARC_ELEVATION * elevationFactor;

  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const p = slerp(start, end, t);
    const elevation = maxElevation * 4 * t * (1 - t);
    p.multiplyScalar(GLOBE_RADIUS + ARC_SURFACE_OFFSET + elevation);
    points.push(p);
  }

  snapArcEndpointsToMarkerSurface(points, start, end);
  return points;
}

/**
 * Generate a flattened arc that follows the same direction as the great
 * circle but stays at moderate latitudes using lat/lon interpolation.
 */
function generateFlattenedArc(from, to, segments = ARC_SEGMENTS) {
  const shortDelta = shortestLonDelta(from.lon, to.lon);
  const start = latLonToVec3(from.lat, from.lon).normalize();
  const end = latLonToVec3(to.lat, to.lon).normalize();

  // Use the long path to create a clear directional sweep
  const ANTIPODAL_THRESHOLD = 170;
  let lonDelta;
  if (Math.abs(shortDelta) > ANTIPODAL_THRESHOLD) {
    lonDelta = shortDelta > 0 ? shortDelta - 360 : shortDelta + 360;
  } else {
    lonDelta = shortDelta;
  }

  // Elevation scaling based on the angular extent of the route
  const routeFraction = Math.abs(lonDelta) / 360;
  const elevationScale = Math.min(routeFraction * 2, 1.0);
  const maxElevation =
    GLOBE_RADIUS * ARC_ELEVATION * (0.3 + 0.7 * elevationScale);

  const points = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;

    // Interpolate lat and lon, both change monotonically
    const lat = from.lat + (to.lat - from.lat) * t;
    const lon = from.lon + lonDelta * t;

    const p = latLonToVec3(lat, lon).normalize();
    const elevation = maxElevation * 4 * t * (1 - t);
    p.multiplyScalar(GLOBE_RADIUS + ARC_SURFACE_OFFSET + elevation);
    points.push(p);
  }

  snapArcEndpointsToMarkerSurface(points, start, end);
  return points;
}

/**
 * Generate arc points between two cities.
 *
 * For short/medium routes (great-circle peak lat < 65°):
 *   → Direct great-circle arc via slerp.
 *
 * For routes where the great circle would fly over the poles:
 *   → Lat/lon interpolation in the same direction as the great circle,
 *     but constrained to moderate latitudes.
 */
function generateArcPoints(from, to) {
  const peakLat = greatCirclePeakLat(from, to);

  if (peakLat < WAYPOINT_LAT_THRESHOLD) {
    return generateSimpleArc(from, to);
  }

  return generateFlattenedArc(from, to);
}

// =========================================================================
// CITY MARKER — animated dot + glow with scale/fade-in
// =========================================================================
function createTextSprite(text, scale) {
  // Strip parenthesized suffix — keep only the city name
  const cleanText = text.replace(/\s*\(.*\)$/, "");

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  const fontSize = 72;
  const font = `bold ${fontSize}px "Nunito Sans", "Segoe UI", sans-serif`;
  ctx.font = font;
  const metrics = ctx.measureText(cleanText);
  const pad = 28;
  canvas.width = metrics.width + pad * 2;
  canvas.height = fontSize + pad * 2;

  ctx.font = font;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.shadowColor = "rgba(0,0,0,0.7)";
  ctx.shadowBlur = 14;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = "#ffe4f0";
  ctx.fillText(cleanText, canvas.width / 2, canvas.height / 2);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;

  const mat = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    opacity: 0,
    depthTest: false
  });

  const sprite = new THREE.Sprite(mat);
  const aspect = canvas.width / canvas.height;
  const baseH = 0.055 * Math.max(scale, 0.45);
  sprite.scale.set(baseH * aspect, baseH, 1);
  sprite.renderOrder = 2;

  return { sprite, material: mat, texture };
}

function createCityMarker(worldPos, markerScale = 1, cityName = "") {
  const scale = THREE.MathUtils.clamp(markerScale, MIN_MARKER_SCALE, MAX_MARKER_SCALE);
  const surfacePos = worldPos
    .clone()
    .normalize()
    .multiplyScalar(GLOBE_RADIUS + MARKER_SURFACE_OFFSET);

  const dotGeom = new THREE.SphereGeometry(0.0125 * scale, 16, 16);
  const dotMat = new THREE.MeshBasicMaterial({
    color: 0xff3333,
    transparent: true,
    opacity: 0
  });
  const dot = new THREE.Mesh(dotGeom, dotMat);
  dot.position.copy(surfacePos);
  dot.scale.setScalar(0.01);
  routeGroup.add(dot);

  const glowGeom = new THREE.SphereGeometry(0.022 * scale, 16, 16);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xff6666,
    transparent: true,
    opacity: 0
  });
  const glow = new THREE.Mesh(glowGeom, glowMat);
  glow.position.copy(surfacePos);
  glow.scale.setScalar(0.01);
  routeGroup.add(glow);

  const pulseGeom = new THREE.SphereGeometry(0.032 * scale, 16, 16);
  const pulseMat = new THREE.MeshBasicMaterial({
    color: 0xff4444,
    transparent: true,
    opacity: 0
  });
  const pulse = new THREE.Mesh(pulseGeom, pulseMat);
  pulse.position.copy(surfacePos);
  pulse.scale.setScalar(0.01);
  routeGroup.add(pulse);

  // City name label above the dot
  let label = null;
  let labelMat = null;
  if (cityName) {
    const labelOffset = 0.018 * scale + 0.008;
    const labelPos = worldPos
      .clone()
      .normalize()
      .multiplyScalar(GLOBE_RADIUS + MARKER_SURFACE_OFFSET + labelOffset);
    const txt = createTextSprite(cityName, scale);
    txt.sprite.position.copy(labelPos);
    routeGroup.add(txt.sprite);
    label = txt.sprite;
    labelMat = txt.material;
  }

  const APPEAR_DURATION = 0.6;
  let elapsed = 0;
  let appeared = false;

  function update(dt) {
    elapsed += dt;
    const t = Math.min(elapsed / APPEAR_DURATION, 1);
    const eased = easeOutCubic(t);
    const glowBaseOpacity = THREE.MathUtils.lerp(0.08, 0.24, scale);
    const pulseBaseOpacity = THREE.MathUtils.lerp(0.06, 0.2, scale);
    const pulseGrowth = THREE.MathUtils.lerp(0.24, 0.55, scale);

    dot.scale.setScalar(eased);
    glow.scale.setScalar(eased);
    dotMat.opacity = eased;
    glowMat.opacity = eased * glowBaseOpacity;

    if (labelMat) {
      labelMat.opacity = eased;
    }

    if (t >= 1) {
      appeared = true;
      const pulseT = ((elapsed - APPEAR_DURATION) % 1.5) / 1.5;
      const pulseEased = easeOutCubic(pulseT);
      pulse.scale.setScalar(1 + pulseEased * pulseGrowth);
      pulseMat.opacity = pulseBaseOpacity * (1 - pulseEased);
    }

    return appeared;
  }

  return {
    dot,
    glow,
    pulse,
    label,
    update
  };
}

// =========================================================================
// CAMERA CONTROLLER — world-space tracking with smooth interpolation
// =========================================================================

// Distance from globe center the camera should be during animation
let cameraOrbitRadius = getViewportOrbitRadius();
let activeRouteOrbitRadius = null;
let smoothRouteOrbitRadius = cameraOrbitRadius;
let routeTravelOrbitRadius = cameraOrbitRadius;
let activeRouteSegmentIndex = -1;
let routeZoomBlend = 0;
let routeZoomEnabled = false;
const ROUTE_ZOOM_LERP = 0.035;
const ROUTE_UNZOOM_LERP = 0.018;
const ROUTE_ZOOM_START_ANGLE_RAD = THREE.MathUtils.degToRad(18);
const ROUTE_ZOOM_END_ANGLE_RAD = THREE.MathUtils.degToRad(6.5);

// Default camera state (matches initial load)
const DEFAULT_CAMERA_POS = new THREE.Vector3(0, 0, getViewportCameraDistance());
const DEFAULT_CAMERA_TARGET = new THREE.Vector3(0, 0, 0);

// Smoothed camera state (world-space positions that the camera lerps toward)
const smoothCamPos = new THREE.Vector3();
const smoothCamLookAt = new THREE.Vector3();
let cameraInitialized = false;

// Camera reset transition state
let cameraResetting = false;
const CAMERA_RESET_LERP = 0.04;

function primeCameraSmoothingFromCurrentView() {
  const worldCenter = localToWorld(new THREE.Vector3(0, 0, 0));
  smoothCamPos.copy(camera.position);
  smoothCamLookAt.copy(controls.target);
  smoothRouteOrbitRadius = camera.position.distanceTo(worldCenter);
  routeTravelOrbitRadius = smoothRouteOrbitRadius;
  cameraInitialized = true;
}

function getStagedRouteOrbitRadius(worldCenter, targetOutward) {
  if (activeRouteOrbitRadius === null || !routeZoomEnabled) {
    return routeTravelOrbitRadius;
  }
  const baseTravelRadius = routeTravelOrbitRadius;

  const currentOutward = smoothCamPos.clone().sub(worldCenter);
  if (currentOutward.lengthSq() < 1e-6) return baseTravelRadius;

  currentOutward.normalize();
  const angleToTarget = currentOutward.angleTo(targetOutward);

  const desiredBlend = THREE.MathUtils.clamp(
    (ROUTE_ZOOM_START_ANGLE_RAD - angleToTarget) /
      (ROUTE_ZOOM_START_ANGLE_RAD - ROUTE_ZOOM_END_ANGLE_RAD),
    0,
    1
  );
  routeZoomBlend = Math.max(routeZoomBlend, easeInOutCubic(desiredBlend));
  return THREE.MathUtils.lerp(
    baseTravelRadius,
    activeRouteOrbitRadius,
    routeZoomBlend
  );
}

/**
 * Given a local-space focus point on/above the globe, compute the ideal
 * world-space camera position and lookAt target.
 */
function computeWorldCamera(localFocusPoint) {
  const worldFocus = localToWorld(localFocusPoint);
  const worldCenter = localToWorld(new THREE.Vector3(0, 0, 0));

  // Direction from globe center through the focus point (world space)
  const outward = worldFocus.clone().sub(worldCenter).normalize();

  // Camera sits along this outward direction at fixed radius from globe center
  const targetOrbitRadius = getStagedRouteOrbitRadius(worldCenter, outward);
  const orbitLerpFactor =
    targetOrbitRadius < smoothRouteOrbitRadius
      ? ROUTE_ZOOM_LERP
      : ROUTE_UNZOOM_LERP;
  smoothRouteOrbitRadius = THREE.MathUtils.lerp(
    smoothRouteOrbitRadius,
    targetOrbitRadius,
    orbitLerpFactor
  );
  const camPos = worldCenter
    .clone()
    .add(outward.clone().multiplyScalar(smoothRouteOrbitRadius));

  // LookAt the globe center — this guarantees the focus point (which is
  // between the camera and center) stays centered on screen
  const lookAt = worldCenter;

  return {
    camPos,
    lookAt
  };
}

/**
 * Update the camera to track a local-space focus point.
 */
function trackCamera(localFocusPoint, lerpFactor) {
  if (!cameraInitialized) {
    // First frame: start from current view to avoid hard camera jumps
    primeCameraSmoothingFromCurrentView();
  }

  const { camPos, lookAt } = computeWorldCamera(localFocusPoint);

  // Smoothly interpolate toward ideal positions
  smoothCamPos.lerp(camPos, lerpFactor);
  smoothCamLookAt.lerp(lookAt, lerpFactor);

  // Linear lerp between distant points on the sphere cuts through the
  // interior, making the camera dip closer to the globe (false zoom).
  // Correct the distance with a strong (but soft) pull toward the target
  // orbit radius — this keeps the path mostly direct while preventing
  // noticeable zoom artifacts.
  const worldCenter = localToWorld(new THREE.Vector3(0, 0, 0));
  const offset = smoothCamPos.clone().sub(worldCenter);
  const currentDist = offset.length();
  if (currentDist > 1e-6) {
    const correctedDist = THREE.MathUtils.lerp(
      currentDist,
      smoothRouteOrbitRadius,
      0.45
    );
    offset.multiplyScalar(correctedDist / currentDist);
    smoothCamPos.copy(worldCenter).add(offset);
  }

  camera.position.copy(smoothCamPos);
  controls.target.copy(smoothCamLookAt);
}

// =========================================================================
// ROUTE ANIMATION — cinematic sequenced state machine
// =========================================================================
const PHASE_TRAVEL = "travel";     // camera moves to first city, no zoom
const PHASE_ZOOM = "zoom";         // camera zooms in before drawing
const PHASE_DOT_START = "dot_start";
const PHASE_LINE_DRAW = "line_draw";
const PHASE_DOT_END = "dot_end";
const PHASE_COMPLETE = "complete";

const DOT_APPEAR_TIME = 0.85; // seconds for a dot to fully appear
const LINE_DRAW_TIME = 3.4; // seconds per segment to draw the line

// Camera lerp speeds per phase — faster during line draw to keep up,
// gentler during dot phases for cinematic holds
const LERP_DOT = 0.055;
const LERP_LINE = 0.05;

let routeAnimation = null;
// Track all transparent materials for fade-out
let fadeOutState = null;
let routePreparing = false;

/** Immediately remove all route visuals and dispose GPU resources. */
function clearRoute() {
  clearLetterAutoOpenTimer();
  while (routeGroup.children.length > 0) {
    const child = routeGroup.children[0];
    if (child.geometry) child.geometry.dispose();
    if (child.material) child.material.dispose();
    routeGroup.remove(child);
  }
  routeAnimation = null;
  fadeOutState = null;
  activeRouteOrbitRadius = null;
  smoothRouteOrbitRadius = cameraOrbitRadius;
  routeTravelOrbitRadius = cameraOrbitRadius;
  activeRouteSegmentIndex = -1;
  routeZoomBlend = 0;
  routeZoomEnabled = false;
  routePreparing = false;
}

/** Collect all transparent materials in routeGroup for fadeout. */
function collectRouteMaterials() {
  const mats = [];
  routeGroup.traverse((obj) => {
    if (obj.material && obj.material.transparent) {
      mats.push({
        mat: obj.material,
        startOpacity: obj.material.opacity
      });
    }
  });
  return mats;
}

/**
 * Begin a smooth clear fade out route visuals, reset camera, then remove.
 * Disables both buttons during transition.
 */
function clearRouteWithReset() {
  clearLetterAutoOpenTimer();
  // Clear the input field
  cityInput.value = "";
  hideCitySuggestions();
  activeRouteOrbitRadius = null;
  routeZoomEnabled = false;
  routePreparing = false;

  // Stop any in-progress animation immediately
  if (routeAnimation) {
    routeAnimation.phase = PHASE_COMPLETE;
  }

  // Re-enable controls
  controls.enabled = true;

  // If there's nothing to clear, just reset state
  if (routeGroup.children.length === 0) {
    clearBtn.disabled = true;
    setStatus(null);
    return;
  }

  // Disable buttons during transition
  animateBtn.disabled = true;
  clearBtn.disabled = true;
  setStatus(null);

  // Start fade-out
  const materials = collectRouteMaterials();
  fadeOutState = {
    materials,
    elapsed: 0,
    duration: 0.5 // seconds
  };

  // Start camera reset
  cameraResetting = true;
  smoothCamPos.copy(camera.position);
  smoothCamLookAt.copy(controls.target);
}

/** Per-frame update for the fadeout + camera reset transition. */
function updateClearTransition(dt) {
  // Fade out route visuals
  if (fadeOutState) {
    fadeOutState.elapsed += dt;
    const t = Math.min(fadeOutState.elapsed / fadeOutState.duration, 1);
    const fade = 1 - easeOutCubic(t);

    for (const { mat, startOpacity } of fadeOutState.materials) {
      mat.opacity = startOpacity * fade;
    }

    if (t >= 1) {
      // Fade complete — remove all route objects
      clearRoute();
      animateBtn.disabled = false;
      // clearBtn stays disabled (nothing to clear)
    }
  }

  // Smooth camera reset
  if (cameraResetting) {
    smoothCamPos.lerp(DEFAULT_CAMERA_POS, CAMERA_RESET_LERP);
    smoothCamLookAt.lerp(DEFAULT_CAMERA_TARGET, CAMERA_RESET_LERP);
    camera.position.copy(smoothCamPos);
    controls.target.copy(smoothCamLookAt);

    // Check if close enough to snap
    const posDist = smoothCamPos.distanceTo(DEFAULT_CAMERA_POS);
    const targetDist = smoothCamLookAt.distanceTo(DEFAULT_CAMERA_TARGET);
    if (posDist < 0.005 && targetDist < 0.005) {
      camera.position.copy(DEFAULT_CAMERA_POS);
      controls.target.copy(DEFAULT_CAMERA_TARGET);
      cameraResetting = false;
      cameraInitialized = false;
    }
  }
}

async function startRouteAnimation(cityNames) {
  clearLetterAutoOpenTimer();
  clearRoute();
  routePreparing = true;
  animateBtn.disabled = true;
  clearBtn.disabled = false;
  primeCameraSmoothingFromCurrentView();

  // Disable user controls during animation
  controls.enabled = false;

  // --- Geocode ---
  setStatus(pageRouteI18n.searchingPlaces || "Recherche de nos lieux…");
  const cities = [];
  const errors = [];

  for (const name of cityNames) {
    try {
      const result = await geocodeCity(name);
      cities.push(result);
    } catch (err) {
      errors.push(err.message);
    }
  }

  if (errors.length > 0) showError(errors.join("; "));

  if (cities.length < 2) {
    showError(
      pageRouteI18n.needTwoCities ||
        "Il faut au moins deux villes valides pour relier votre histoire."
    );
    setStatus(null);
    animateBtn.disabled = false;
    clearBtn.disabled = true;
    controls.enabled = true;
    routePreparing = false;
    return;
  }

  setStatus(
    `${pageRouteI18n.routeLinks || "Reliés par :"} ${cities
      .map((c) => c.name)
      .join(" → ")}`
  );

  // --- City positions / segment metrics in local space ---
  const cityPositions = cities.map((c) => latLonToVec3(c.lat, c.lon));
  const segmentAngles = [];
  const segmentOrbitRadii = [];
  const segmentDrawDurations = [];
  const cityMarkerScales = new Array(cities.length).fill(MAX_MARKER_SCALE);
  for (let i = 0; i < cityPositions.length - 1; i++) {
    const segmentAngle = cityPositions[i].angleTo(cityPositions[i + 1]);
    const segmentMarkerScale = getMarkerScaleForAngle(segmentAngle);
    segmentAngles.push(segmentAngle);
    segmentOrbitRadii.push(
      getRouteOrbitRadiusForAngle(segmentAngle, cameraOrbitRadius)
    );
    segmentDrawDurations.push(getLineDrawDurationForAngle(segmentAngle));
    cityMarkerScales[i] = Math.min(cityMarkerScales[i], segmentMarkerScale);
    cityMarkerScales[i + 1] = Math.min(
      cityMarkerScales[i + 1],
      segmentMarkerScale
    );
  }

  // --- Pre-compute all arc segments ---
  const segments = [];
  for (let i = 0; i < cities.length - 1; i++) {
    const arcPoints = generateArcPoints(cities[i], cities[i + 1]);
    segments.push({
      from: cities[i],
      to: cities[i + 1],
      points: arcPoints
    });
  }

  // --- Extend arc endpoints into marker dots so the line always reaches ---
  for (let i = 0; i < segments.length; i++) {
    const pts = segments[i].points;
    if (pts.length < 2) continue;
    const startDotR = 0.0125 * cityMarkerScales[i];
    const endDotR = 0.0125 * cityMarkerScales[i + 1];
    const d0 = pts[0].clone().sub(pts[1]).normalize();
    pts[0].addScaledVector(d0, startDotR * 1.2);
    const dN = pts[pts.length - 1].clone().sub(pts[pts.length - 2]).normalize();
    pts[pts.length - 1].addScaledVector(dN, endDotR * 1.2);
  }

  // --- Build a single line geometry spanning all segments ---
  let totalPoints = 0;
  const segmentOffsets = [];
  for (const seg of segments) {
    segmentOffsets.push(totalPoints);
    totalPoints += seg.points.length;
  }

  const positions = new Float32Array(totalPoints * 3);
  let idx = 0;
  for (const seg of segments) {
    for (const p of seg.points) {
      positions[idx++] = p.x;
      positions[idx++] = p.y;
      positions[idx++] = p.z;
    }
  }

  const geometry = new LineGeometry();
  geometry.setPositions(positions);
  geometry.instanceCount = 0;

  const lineMat = new LineMaterial({
    color: 0xff2222,
    linewidth: 2,
    transparent: true,
    opacity: 0.95,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight)
  });
  const line = new Line2(geometry, lineMat);
  line.computeLineDistances();
  routeGroup.add(line);

  const glowMat = new LineMaterial({
    color: 0xff5555,
    linewidth: 3,
    transparent: true,
    opacity: 0.45,
    resolution: new THREE.Vector2(window.innerWidth, window.innerHeight)
  });
  const glowLine = new Line2(geometry, glowMat);
  glowLine.computeLineDistances();
  routeGroup.add(glowLine);

  activeRouteOrbitRadius = segmentOrbitRadii[0] ?? null;

  // --- Initialize animation state ---
  const markers = new Array(cities.length).fill(null);
  markers[0] = createCityMarker(cityPositions[0], cityMarkerScales[0], cities[0].name);

  routeAnimation = {
    cities,
    cityPositions,
    cityMarkerScales,
    segmentAngles,
    segmentOrbitRadii,
    segmentDrawDurations,
    segments,
    segmentOffsets,
    totalPoints,
    geometry,
    line,
    glowLine,

    currentSegment: 0,
    phase: PHASE_TRAVEL,
    phaseElapsed: 0,

    markers,
    globalDrawCount: 0,

    // The local-space point the camera should focus on right now
    focusPoint: cityPositions[0].clone()
  };
  routeZoomEnabled = false;
  routePreparing = false;
}

/**
 * Per-frame update for the cinematic route animation.
 * Returns true while animating, false when complete.
 */
function updateRouteAnimation(dt) {
  const ra = routeAnimation;
  if (!ra || ra.phase === PHASE_COMPLETE) return false;

  ra.phaseElapsed += dt;

  const segIdx = ra.currentSegment;
  const seg = ra.segments[segIdx];
  const fromCity = ra.cityPositions[segIdx];
  const toCity = ra.cityPositions[segIdx + 1];
  activeRouteOrbitRadius = ra.segmentOrbitRadii?.[segIdx] ?? cameraOrbitRadius;
  if (segIdx !== activeRouteSegmentIndex) {
    activeRouteSegmentIndex = segIdx;
    routeZoomBlend = 0;
  }

  // ---------------------------------------------------------------
  // PHASE: Travel to first city (no zoom, no line)
  // ---------------------------------------------------------------
  if (ra.phase === PHASE_TRAVEL) {
    routeZoomEnabled = false;

    if (!ra.markers[0]) {
      ra.markers[0] = createCityMarker(
        ra.cityPositions[0],
        ra.cityMarkerScales[0],
        ra.cities[0].name
      );
    }
    ra.markers[0].update(dt);

    ra.focusPoint.copy(ra.cityPositions[0]);

    // Ease-in: start very gentle, ramp up over ~1 second for a fluid takeoff
    const rampT = Math.min(ra.phaseElapsed / 1.0, 1);
    const travelLerp = THREE.MathUtils.lerp(0.006, LERP_DOT, easeInOutCubic(rampT));
    trackCamera(ra.focusPoint, travelLerp);

    // Check if camera is roughly facing the destination
    const worldCenter = localToWorld(new THREE.Vector3(0, 0, 0));
    const camDir = smoothCamPos.clone().sub(worldCenter).normalize();
    const cityWorld = localToWorld(ra.cityPositions[0]);
    const targetDir = cityWorld.clone().sub(worldCenter).normalize();
    const angle = camDir.angleTo(targetDir);

    if (angle < THREE.MathUtils.degToRad(15) || ra.phaseElapsed > 4) {
      ra.phase = PHASE_ZOOM;
      ra.phaseElapsed = 0;
    }
  }

  // ---------------------------------------------------------------
  // PHASE: Zoom in before drawing
  // ---------------------------------------------------------------
  else if (ra.phase === PHASE_ZOOM) {
    routeZoomEnabled = true;
    routeZoomBlend = 1; // force full zoom target

    for (const m of ra.markers) {
      if (m) m.update(dt);
    }

    ra.focusPoint.copy(ra.cityPositions[0]);
    trackCamera(ra.focusPoint, LERP_DOT);

    // Transition when orbit radius is close enough to target
    const targetRadius = activeRouteOrbitRadius ?? cameraOrbitRadius;
    const totalRange = Math.abs(routeTravelOrbitRadius - targetRadius);
    const remaining = Math.abs(smoothRouteOrbitRadius - targetRadius);

    if (remaining < totalRange * 0.12 || ra.phaseElapsed > 2.5) {
      ra.phase = PHASE_LINE_DRAW;
      ra.phaseElapsed = 0;
    }
  }

  // ---------------------------------------------------------------
  // PHASE: Show departure dot
  // ---------------------------------------------------------------
  else if (ra.phase === PHASE_DOT_START) {
    routeZoomEnabled = false;
    if (!ra.markers[segIdx]) {
      ra.markers[segIdx] = createCityMarker(
        fromCity,
        ra.cityMarkerScales[segIdx],
        ra.cities[segIdx].name
      );
    }

    ra.markers[segIdx].update(dt);

    // Focus on the departure city
    ra.focusPoint.copy(fromCity);
    trackCamera(ra.focusPoint, LERP_DOT);

    if (ra.phaseElapsed >= DOT_APPEAR_TIME) {
      ra.phase = PHASE_LINE_DRAW;
      ra.phaseElapsed = 0;
    }
  }

  // ---------------------------------------------------------------
  // PHASE: Draw the arc line progressively
  // ---------------------------------------------------------------
  else if (ra.phase === PHASE_LINE_DRAW) {
    for (const m of ra.markers) {
      if (m) m.update(dt);
    }

    const drawDuration =
      ra.segmentDrawDurations?.[segIdx] ?? LINE_DRAW_TIME;
    const rawT = Math.min(ra.phaseElapsed / drawDuration, 1);
    routeZoomEnabled = true;
    const easedT = easeInOutCubic(rawT);

    const segPointCount = seg.points.length;
    const pointsToShow = THREE.MathUtils.clamp(
      Math.floor(easedT * (segPointCount - 1)) + 1,
      1,
      segPointCount
    );

    ra.globalDrawCount = ra.segmentOffsets[segIdx] + pointsToShow;
    ra.geometry.instanceCount = Math.max(0, ra.globalDrawCount - 1);

    // Focus camera on the leading edge of the line
    const leadIdx = Math.max(0, pointsToShow - 1);
    const leadPoint = seg.points[leadIdx];
    ra.focusPoint.copy(leadPoint);
    trackCamera(ra.focusPoint, LERP_LINE);

    if (rawT >= 1) {
      ra.globalDrawCount = ra.segmentOffsets[segIdx] + segPointCount;
      ra.geometry.instanceCount = Math.max(0, ra.globalDrawCount - 1);

      ra.phase = PHASE_DOT_END;
      ra.phaseElapsed = 0;
    }
  }

  // ---------------------------------------------------------------
  // PHASE: Show arrival dot
  // ---------------------------------------------------------------
  else if (ra.phase === PHASE_DOT_END) {
    routeZoomEnabled = true;
    for (const m of ra.markers) {
      if (m) m.update(dt);
    }

    const arrivalIdx = segIdx + 1;
    if (!ra.markers[arrivalIdx]) {
      ra.markers[arrivalIdx] = createCityMarker(
        toCity,
        ra.cityMarkerScales[arrivalIdx],
        ra.cities[arrivalIdx].name
      );
    }
    ra.markers[arrivalIdx].update(dt);

    // Focus on the arrival city
    ra.focusPoint.copy(toCity);
    trackCamera(ra.focusPoint, LERP_DOT);

    if (ra.phaseElapsed >= DOT_APPEAR_TIME) {
      if (segIdx < ra.segments.length - 1) {
        ra.currentSegment++;
        ra.phase = PHASE_LINE_DRAW;
        ra.phaseElapsed = 0;
      } else {
        ra.phase = PHASE_COMPLETE;
        activeRouteOrbitRadius = null;
        routeZoomEnabled = false;
        animateBtn.disabled = false;
        clearBtn.disabled = false;
        controls.enabled = true;
        setStatus(
          `${pageRouteI18n.connectionComplete || "Connexion terminée :"} ${ra.cities
            .map((c) => c.name)
            .join(" → ")}`
        );
        setTimeout(() => setStatus(null), 5000);
        scheduleLetterAutoOpen();
      }
    }
  }

  return true;
}

// =========================================================================
// RESIZE
// =========================================================================
function onResize() {
  const previousDefaultZ = DEFAULT_CAMERA_POS.z;
  cameraOrbitRadius = getViewportOrbitRadius();
  DEFAULT_CAMERA_POS.set(0, 0, getViewportCameraDistance());

  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  dynamicPixelRatio = getDynamicPixelRatio(camera.position.length());
  renderer.setPixelRatio(dynamicPixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);

  if (routeAnimation) {
    const res = new THREE.Vector2(window.innerWidth, window.innerHeight);
    routeAnimation.line.material.resolution.copy(res);
    routeAnimation.glowLine.material.resolution.copy(res);
  }

  const isNearDefaultView =
    Math.abs(camera.position.x) < 0.35 &&
    Math.abs(camera.position.y) < 0.35 &&
    Math.abs(camera.position.z - previousDefaultZ) < 0.45;

  if (!routeAnimation && !cameraResetting && isNearDefaultView) {
    camera.position.copy(DEFAULT_CAMERA_POS);
    controls.target.copy(DEFAULT_CAMERA_TARGET);
    smoothCamPos.copy(DEFAULT_CAMERA_POS);
    smoothCamLookAt.copy(DEFAULT_CAMERA_TARGET);
    smoothRouteOrbitRadius = cameraOrbitRadius;
    routeTravelOrbitRadius = cameraOrbitRadius;
  }
}
window.addEventListener("resize", onResize);

// =========================================================================
// ANIMATION LOOP
// =========================================================================
const AUTO_ROTATE_SPEED = 0.0012;
let lastFrameTime = performance.now();

function animate() {
  requestAnimationFrame(animate);

  const now = performance.now();
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  const isAnimating = updateRouteAnimation(dt);

  // Clear transition (fade-out + camera reset)
  updateClearTransition(dt);

  // Auto-rotation (suppressed during route animation and camera reset)
  if (!isAnimating && !cameraResetting && !routePreparing) {
    const idleDuration = now - lastInteractionAt;
    const autoFactor = userInteracting
      ? 0
      : Math.min(idleDuration / IDLE_DELAY_MS, 1);
    globeGroup.rotation.y += AUTO_ROTATE_SPEED * autoFactor;
  }

  const cameraDistance = camera.position.length();
  if (now - lastPixelRatioUpdateAt >= PIXEL_RATIO_UPDATE_INTERVAL_MS) {
    const targetPixelRatio = getDynamicPixelRatio(cameraDistance);
    if (Math.abs(targetPixelRatio - dynamicPixelRatio) > 0.03) {
      dynamicPixelRatio = targetPixelRatio;
      renderer.setPixelRatio(dynamicPixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight, false);
    }
    lastPixelRatioUpdateAt = now;
  }

  const zoomFade = THREE.MathUtils.clamp(
    (cameraDistance - ZOOM_FADE_NEAR_DISTANCE) /
      (ZOOM_FADE_FAR_DISTANCE - ZOOM_FADE_NEAR_DISTANCE),
    0,
    1
  );
  const zoomClose = 1 - zoomFade; // 1 = fully zoomed in, 0 = far away

  if (atmosphereLayer?.material) {
    atmosphereLayer.material.opacity = THREE.MathUtils.lerp(
      ATMOSPHERE_OPACITY_NEAR,
      ATMOSPHERE_OPACITY_FAR,
      zoomFade
    );
  }

  // Dynamic detail: increase bump + detail texture when zoomed in
  if (earthMaterial) {
    // Bump scale: from 0.028 (far) up to 0.08 (close)
    if (earthMaterial.bumpMap) {
      earthMaterial.bumpScale = THREE.MathUtils.lerp(0.028, 0.08, zoomClose);
    }
    // Detail texture blend: 0 when far, up to 0.35 when close
    const shader = earthMaterial.userData.shader;
    if (shader) {
      shader.uniforms.detailBlend.value = THREE.MathUtils.lerp(0.0, 0.35, zoomClose * zoomClose);
    }
  }

  if (countryBorderMainMaterial) {
    countryBorderMainMaterial.opacity = THREE.MathUtils.lerp(
      BORDER_MAIN_OPACITY_FAR,
      BORDER_MAIN_OPACITY_NEAR,
      zoomClose
    );
  }

  if (countryBorderHaloMaterial) {
    countryBorderHaloMaterial.opacity = THREE.MathUtils.lerp(
      BORDER_HALO_OPACITY_FAR,
      BORDER_HALO_OPACITY_NEAR,
      zoomClose
    );
  }

  if (countryBorderHaloLines) {
    countryBorderHaloLines.visible = zoomClose > BORDER_HALO_SHOW_ZOOM_CLOSE;
  }

  if (earthCloudLayer) {
    if (earthCloudLayer.material) {
      earthCloudLayer.material.opacity = THREE.MathUtils.lerp(
        CLOUD_OPACITY_NEAR,
        CLOUD_OPACITY_FAR,
        zoomFade
      );
    }
    earthCloudLayer.rotation.y += CLOUD_ROTATION_SPEED * dt;
  }

  controls.update();
  renderer.render(scene, camera);
}

// =========================================================================
// UI EVENT HANDLERS
// =========================================================================
initFullscreenControl();
initMusicControl();

// Hide route panel — cities are pre-configured
const routePanel = document.getElementById("route-panel");
if (routePanel) routePanel.style.display = "none";

if (startButton) {
  startButton.addEventListener("click", () => {
    startExperience();
  });
}

if (startOverlay) {
  startOverlay.addEventListener("pointerdown", (event) => {
    if (event.pointerType === "mouse" && event.button !== 0) return;
    startExperience();
  });

  startOverlay.addEventListener("click", (event) => {
    startExperience();
  });
}

document.addEventListener("keydown", (event) => {
  if (startOverlay && startOverlay.classList.contains("is-visible")) {
    if (event.key === "Enter" || event.key === " " || event.key === "Escape") {
      event.preventDefault();
      startExperience();
    }
    return;
  }

  if (event.key === "Escape" && isLetterModalOpen()) {
    event.preventDefault();
    closeLetterModal();
  }
});

if (letterFab) {
  letterFab.addEventListener("click", openLetterModal);
}

if (letterClose) {
  letterClose.addEventListener("click", closeLetterModal);
}

if (letterModal) {
  letterModal.addEventListener("mousedown", (event) => {
    if (event.target === letterModal) {
      closeLetterModal();
    }
  });
}

if (cityInput) cityInput.addEventListener("input", () => {
  scheduleCitySuggestions();
});

if (cityInput) cityInput.addEventListener("focus", () => {
  scheduleCitySuggestions();
});

if (citySuggestions) citySuggestions.addEventListener("mousedown", (event) => {
  const option = event.target.closest(".city-suggestion");
  if (!option) return;

  event.preventDefault();
  const index = Number(option.dataset.suggestionIndex);
  applySuggestionSelection(index);
});

document.addEventListener("mousedown", (event) => {
  if (!cityInputWrap.contains(event.target)) {
    hideCitySuggestions();
  }
});

if (animateBtn) animateBtn.addEventListener("click", () => {
  hideCitySuggestions();

  const raw = cityInput.value.trim();
  if (!raw) {
    showError("Saisis au moins deux villes séparées par une virgule pour relier vos cœurs.");
    return;
  }
  const cityNames = raw
    .split(",")
    .map((s) => s.trim())
    .filter(Boolean);
  if (cityNames.length < 2) {
    showError("Saisis au moins deux villes pour continuer.");
    return;
  }
  startRouteAnimation(cityNames);
});

if (clearBtn) clearBtn.addEventListener("click", () => {
  clearRouteWithReset();
});

if (cityInput) cityInput.addEventListener("keydown", (e) => {
  const suggestionsOpen = citySuggestions.classList.contains("open");

  if (e.key === "ArrowDown" && suggestionsOpen && currentSuggestions.length > 0) {
    e.preventDefault();
    moveSuggestionSelection(1);
    return;
  }

  if (e.key === "ArrowUp" && suggestionsOpen && currentSuggestions.length > 0) {
    e.preventDefault();
    moveSuggestionSelection(-1);
    return;
  }

  if (e.key === "Escape" && suggestionsOpen) {
    e.preventDefault();
    hideCitySuggestions();
    return;
  }

  if (e.key === "Enter" && suggestionsOpen && activeSuggestionIndex >= 0) {
    e.preventDefault();
    applySuggestionSelection(activeSuggestionIndex);
    return;
  }

  if (e.key === "Enter" && !animateBtn.disabled) {
    e.preventDefault();
    animateBtn.click();
  }
});

// =========================================================================
// INIT
// =========================================================================
buildGlobe()
  .then(() => {
    loader.classList.add("hidden");
    showStartOverlay();
  })
  .catch((err) => {
    console.error(err);
    showError("Une erreur est survenue pendant la préparation du globe.");
    loader.classList.add("hidden");
    showStartOverlay();
  });

animate();

</script>
</body>
</html>
