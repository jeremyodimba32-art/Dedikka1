:root{--background:oklch(.09 .025 300);--foreground:oklch(.97 0 0);--primary:oklch(.55 .25 305);--muted-foreground:oklch(.75 .1 325);--border:oklch(.5 .23 305/.5);--space-start:linear-gradient(135deg,oklch(0 0 0),oklch(.19 .11 305) 50%,oklch(.3 .2 305));--space-mobile:linear-gradient(135deg,oklch(0 0 0),oklch(.19 .11 305));--cosmic-text:linear-gradient(90deg,oklch(.78 .15 220),oklch(.51 .27 295),oklch(.63 .27 350),oklch(.7 .2 40),oklch(.78 .15 220));--cosmic-glow:oklch(.5 .25 305/.7);--modal-shade:oklch(0 0 0/.85);--galaxy-pink:oklch(.65 .27 350);--galaxy-cyan:oklch(.8 .15 210);--galaxy-violet:oklch(.55 .28 305);--galaxy-rose:oklch(.75 .17 355)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:'Indie Flower',cursive;background:var(--background);color:var(--foreground)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.universe{position:fixed;inset:0;background:var(--background);color:var(--foreground)}
.galaxy-stage,.galaxy-stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.start-screen{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:20px;background:var(--space-start);cursor:pointer}
.start-page-title{max-width:min(90vw,760px);margin:0 0 14px;text-align:center;font-family:'Permanent Marker',cursive;font-size:clamp(30px,5vw,58px);line-height:1.15;background:var(--cosmic-text);background-size:300%;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px var(--cosmic-glow))}.start-trigger{display:flex;flex-direction:column;align-items:center;height:auto;padding:0;background:none;border:0;gap:0;white-space:normal}
.start-trigger:hover{background:none}
.start-heart{width:200px;height:200px;object-fit:contain;margin-bottom:40px}
.start-label{font-family:'Permanent Marker',cursive;font-size:50px;font-weight:bold;line-height:1.2;background:var(--cosmic-text);background-size:300% 300%;background-clip:text;color:transparent;animation:gradient-flow 4s ease infinite;filter:drop-shadow(0 0 30px var(--cosmic-glow))}
.start-subtitle{font-size:36px;color:var(--muted-foreground);margin-top:12px;text-align:center;animation:gentle-fade 3s ease-in-out infinite}
.cosmic-specks{position:absolute;inset:0;pointer-events:none}
.cosmic-specks i{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--primary);opacity:.25;animation:cosmic-float 4s ease-in-out infinite}
.cosmic-specks i:nth-child(1){left:34%;top:37%}.cosmic-specks i:nth-child(2){left:4%;top:73%;animation-delay:1s}.cosmic-specks i:nth-child(3){left:47%;top:74%;animation-delay:2s}.cosmic-specks i:nth-child(4){left:59%;top:10%;animation-delay:3s}.cosmic-specks i:nth-child(5){left:35%;top:92%;animation-delay:1.5s}.cosmic-specks i:nth-child(6){left:65%;top:77%;animation-delay:2.5s}
.fullscreen-control{position:fixed;right:13px;top:13px;z-index:30;width:37px;height:37px;display:grid;place-items:center;padding:0;border:1px solid var(--border);border-radius:50%;background:var(--background);color:var(--primary);box-shadow:0 0 12px var(--cosmic-glow)}
.fullscreen-control:hover{filter:brightness(1.25)}
.fullscreen-control svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.galaxy-title{position:absolute;top:20px;left:50%;transform:translateX(-50%);margin:0;font-family:'Permanent Marker',cursive;font-size:64px;background:var(--cosmic-text);background-size:300%;background-clip:text;color:transparent;pointer-events:none;animation:gentle-fade 3s ease-in-out}
.universe-loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:20px;color:var(--primary);font-size:22px;pointer-events:none}
.universe-loading span{height:6px;width:min(350px,80vw);background:var(--cosmic-text);animation:gentle-fade 1s infinite}
.photo-modal{position:fixed;inset:0;z-index:50;background:var(--modal-shade);backdrop-filter:blur(10px);display:grid;place-items:center;padding:16px}
.photo-content{position:relative;border:2px solid var(--border);border-radius:20px;background:var(--background);padding:30px;max-width:90vw;box-shadow:0 0 50px var(--cosmic-glow);animation:photo-in .4s ease-out}
.photo-content img{display:block;width:250px;height:250px;max-width:65vw;object-fit:cover;border-radius:15px}
.photo-caption{text-align:center;color:var(--muted-foreground);font-size:32px;margin:12px 0 0}
.photo-close{position:absolute;top:0;right:0;width:38px;height:38px;display:grid;place-items:center;border:0;background:transparent;color:var(--foreground)}
.photo-close svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
@keyframes gradient-flow{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes gentle-fade{0%,100%{opacity:.7}50%{opacity:1}}
@keyframes cosmic-float{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-30px);opacity:.45}}
@keyframes photo-in{from{transform:scale(.8) translateY(50px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:768px){.start-screen{background:var(--space-mobile)}.start-page-title{font-size:38px}.start-heart{width:160px;height:160px}.start-label{font-size:32px}.start-subtitle{font-size:24px}.galaxy-title{font-size:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>

<!-- DEDIKKA_PAGE_DATA -->
<script>
(async function(){
  const apiOrigin = String(window.DEDIKKA_CONFIG?.backendUrl || "https://dedikka.onrender.com").replace(/\/+$/, "");
  const params = new URLSearchParams(window.location.search);
  const status = document.querySelector(".start-subtitle");
  const slug = params.get("slug") || window.location.pathname.match(/\/p\/([^/]+)/)?.[1] || "";
  let page = window.DEDIKKA_PAGE_DATA || null;
  if (!page && slug) {
    status.textContent = "Chargement des données…";
    try {
      const response = await fetch(`${apiOrigin}/api/v1/public/pages/${encodeURIComponent(slug)}`, { headers: { Accept: "application/json" } });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      page = await response.json();
    } catch (error) {
      console.error("Dedikka : le serveur ne répond pas.", error);
      status.textContent = "Aperçu 3D affiché ; données du serveur indisponibles.";
    }
  }
  const fields = page?.form_fields || {};
  const getField = (name) => String(fields[`data[${name}]`] ?? fields[name] ?? "").trim();
  function externalUrl(value) {
    if (typeof value !== "string" || !value.trim() || value.startsWith("data:")) return "";
    try {
      const url = new URL(value, `${apiOrigin}/`);
      return url.protocol === "https:" || url.protocol === "http:" ? url.href : "";
    } catch { return ""; }
  }
  const imageCountValue = Number.parseInt(getField("num_images"), 10);
  const imageCountLimit = Number.isFinite(imageCountValue) ? Math.max(0, Math.min(4, imageCountValue)) : 4;
  const imageEntries = Object.entries(page?.images || {})
    .filter(([key]) => /^image_\d+$/.test(key))
    .sort(([a], [b]) => Number(a.slice(6)) - Number(b.slice(6)));
  const photoItems = imageEntries
    .filter(([key]) => Number(key.slice(6)) <= imageCountLimit)
    .map(([key, value]) => {
      const imageIndex = Number(key.slice(6));
      return {
        url: externalUrl(value),
        caption: getField(`image_message_${imageIndex}`),
      };
    })
    .filter((item) => item.url);
  if (!photoItems.length) {
    const previewPhoto = externalUrl(page?.images?.cover_image) || externalUrl(getField("image_url")) || externalUrl(params.get("photo"));
    if (previewPhoto) photoItems.push({ url: previewPhoto, caption: getField("image_message_1") });
  }
  const hasRealPhoto = photoItems.length > 0;
  const photoUrl = photoItems[0]?.url || "";
  const scenePhotoUrls = photoItems.map((item) => item.url);
  const recipientName = String(getField("h1_title") || page?.recipient_name || getField("recipient_name") || params.get("name") || page?.title || "").trim().slice(0, 30);
  const dedicationTitle = String(getField("title") || page?.title || params.get("title") || "Une dédicace spéciale").trim();
  const startText = getField("btn_text") || getField("start_text") || "Ouvrir ma galaxie";
  const subtitleText = getField("h1_accent") || getField("kicker") || getField("subtitle_text") || "Une galaxie de souvenirs vous attend";
  const phraseCountValue = Number.parseInt(getField("phrases_count") || getField("num_phrases"), 10);
  const phraseCount = Number.isFinite(phraseCountValue) ? Math.max(0, Math.min(15, phraseCountValue)) : 8;
  const phrases = Array.from({ length: phraseCount }, (_, index) => getField(`phrase_${index + 1}`)).filter(Boolean);
  const colorOptions = ["#00d4ff", "#7b2ff7", "#f107a3", "#1E90FF", "#87CEEB", "#FF6B9D"];
  const colors = colorOptions.filter((_, index) => ["on", "true", "1", "yes"].includes(getField(`color_${index + 1}`).toLowerCase()));
  if (!colors.length) colors.push(...colorOptions);
  const titleStyle = getField("title_style");
  const titleColorValue = getField("title_color");
  const titleColor = /^#[0-9a-f]{6}$/i.test(titleColorValue) ? titleColorValue : "#00d4ff";
  const musicEnabled = getField("enable_music").toLowerCase() !== "false";
  const audioUrl = musicEnabled ? externalUrl(getField("music_url") || getField("audio_url") || params.get("audio")) : "";
  window.DEDIKKA_TEMPLATE_DATA = { recipientName, phrases, colors };
  document.documentElement.lang = "fr";
  document.title = `${dedicationTitle} — Dedikka`;const startPageTitle = document.getElementById("start-page-title");startPageTitle.textContent = dedicationTitle;
  const startLabel = document.querySelector(".start-label");
  startLabel.textContent = startText;
  document.querySelector(".start-trigger").setAttribute("aria-label", startText);
  document.querySelector(".start-screen").setAttribute("aria-label", startText);
  if (page || !slug) status.textContent = subtitleText;
  const galaxyTitle = document.getElementById("galaxy-title");
  galaxyTitle.textContent = recipientName || dedicationTitle;
  if (titleStyle === "fixed") {startPageTitle.style.background = "none";startPageTitle.style.backgroundClip = "border-box";startPageTitle.style.webkitBackgroundClip = "border-box";startPageTitle.style.color = titleColor;startPageTitle.style.webkitTextFillColor = titleColor;
    galaxyTitle.style.background = "none";
    galaxyTitle.style.backgroundClip = "border-box";
    galaxyTitle.style.webkitBackgroundClip = "border-box";
    galaxyTitle.style.color = titleColor;
    galaxyTitle.style.webkitTextFillColor = titleColor;
  }
  const modalPhoto = document.querySelector(".photo-content img");
  if (photoUrl) modalPhoto.src = photoUrl;
  else modalPhoto.removeAttribute("src");
  modalPhoto.alt = recipientName ? `Souvenir de ${recipientName}` : "Photo souvenir";
  modalPhoto.hidden = !hasRealPhoto;
  const modalCaption = document.querySelector(".photo-caption");
  modalCaption.textContent = photoItems[0]?.caption || dedicationTitle;
  const musicElement = document.getElementById("music");
  if (audioUrl) musicElement.src = audioUrl;
  const startScreen = document.getElementById("start-screen");
  const startButton = startScreen.querySelector("button");
  const stage = document.getElementById("galaxy-stage");
  const loading = document.getElementById("loading");
  const title = document.getElementById("galaxy-title");
  const audio = document.getElementById("music" );
  const modal = document.getElementById("photo-modal");
  const closeModalButton = document.getElementById("photo-close");
  const fullscreenButton = document.getElementById("fullscreen");
  let started = false;
  let disposeScene = null;
  const enterIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
  const exitIcon = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M16 3v3a2 2 0 0 0 2 2h3M21 16h-3a2 2 0 0 0-2 2v3M3 16h3a2 2 0 0 1 2 2v3"/></svg>';
  function closeModal(){ modal.hidden = true; }
  function start(){
    if (started) return;
    started = true;
    startScreen.hidden = true;
    stage.hidden = false;
    loading.hidden = false;
    if (audio.src) audio.play().catch(function(){});
    try {
      disposeScene = SparkleScene.mountScene(stage, scenePhotoUrls, function(){
        loading.hidden = true;
        title.hidden = false;
      }, function(imageIndex){
        if (!hasRealPhoto) return;
        const selectedPhoto = photoItems[imageIndex] || photoItems[0];
        modalPhoto.src = selectedPhoto.url;
        modalPhoto.alt = `Souvenir de ${recipientName}`;
        modalCaption.textContent = selectedPhoto.caption || dedicationTitle;
        modalPhoto.hidden = false;
        modal.hidden = false;
        closeModalButton.focus();
      });
    } catch (error) {
      const detail = error instanceof Error ? error.message : String(error);
      const webgl2 = window.WebGL2RenderingContext ? "WebGL2 détecté" : "WebGL2 indisponible";
      loading.textContent = "Erreur 3D (" + webgl2 + ") : " + (detail || "cause inconnue");
      console.error(error);
    }
  }
  startScreen.addEventListener("click", start);
  startButton.addEventListener("click", function(event){ event.stopPropagation(); start(); });
  fullscreenButton.addEventListener("click", async function(){
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else await document.documentElement.requestFullscreen();
    } catch (error) { console.warn("Plein écran indisponible.", error); }
  });
  document.addEventListener("fullscreenchange", function(){
    const active = Boolean(document.fullscreenElement);
    fullscreenButton.innerHTML = active ? exitIcon : enterIcon;
    fullscreenButton.setAttribute("aria-label", active ? "Quitter le plein écran" : "Passer en plein écran");
    fullscreenButton.title = active ? "Quitter le plein écran" : "Passer en plein écran";
  });
  closeModalButton.addEventListener("click", closeModal);
  modal.addEventListener("click", function(event){ if (event.target === modal) closeModal(); });
  modal.querySelector(".photo-content").addEventListener("click", function(event){ event.stopPropagation(); });
  document.addEventListener("keydown", function(event){ if (event.key === "Escape") closeModal(); });
  window.addEventListener("pagehide", function(){ if (disposeScene) disposeScene(); });
})();
</script>
