<script>
    window.musicAutoStarted = false;

    window.directMusicPlay = function(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }

        var music = document.getElementById('backgroundMusic');
        var playIcon = document.getElementById('playIcon');
        var pauseIcon = document.getElementById('pauseIcon');
        var volumeSlider = document.getElementById('volumeSlider');
        var musicControl = document.querySelector('.music-control');

        if (!music) return;

        document.body.classList.add('music-visible');
        if (musicControl) musicControl.classList.add('is-visible');
        music.volume = parseFloat((volumeSlider && volumeSlider.value) || '0.5');

        if (music.paused) {
            music.play().then(function() {
                if (playIcon) playIcon.style.display = 'none';
                if (pauseIcon) pauseIcon.style.display = 'block';
            }).catch(function() {});
        }
    };

    window.directMusicToggle = function(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
        }
        if (window.directMusicToggleLast && performance.now() - window.directMusicToggleLast < 300) return;
        window.directMusicToggleLast = performance.now();

        var music = document.getElementById('backgroundMusic');
        var playIcon = document.getElementById('playIcon');
        var pauseIcon = document.getElementById('pauseIcon');

        if (!music || music.paused) {
            window.directMusicPlay();
            return;
        }

        music.pause();
        if (playIcon) playIcon.style.display = 'block';
        if (pauseIcon) pauseIcon.style.display = 'none';
    };

    window.directFullscreenToggle = function(event) {
        if (event) {
            event.preventDefault();
            event.stopPropagation();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
        window.skipSceneActivationUntil = performance.now() + 1000;
        if (window.directFullscreenToggleLast && performance.now() - window.directFullscreenToggleLast < 300) return;
        window.directFullscreenToggleLast = performance.now();

        function syncDirectFullscreenIcon() {
            var isActive = !!(document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement);
            var enterIcon = document.getElementById('fullscreenEnterIcon');
            var exitIcon = document.getElementById('fullscreenExitIcon');
            var button = document.getElementById('fullscreenBtn');
            if (enterIcon) enterIcon.style.display = isActive ? 'none' : 'block';
            if (exitIcon) exitIcon.style.display = isActive ? 'block' : 'none';
            if (button) button.setAttribute('aria-label', isActive ? "Exit fullscreen" : "Plein écran");
        }

        var active = document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement;
        var action = null;
        if (active) {
            var exitFn = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
            if (exitFn) action = exitFn.call(document);
        } else {
            var requestFn = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || document.documentElement.msRequestFullscreen;
            if (requestFn) action = requestFn.call(document.documentElement);
        }
        if (action && typeof action.catch === 'function') {
            action.catch(function() {}).finally(function() {
                setTimeout(syncDirectFullscreenIcon, 80);
            });
        } else {
            setTimeout(syncDirectFullscreenIcon, 80);
        }
    };
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    const cursorEl = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursorEl.style.left = e.clientX + 'px';
        cursorEl.style.top  = e.clientY + 'px';
    });

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x00000a);
    scene.fog = new THREE.FogExp2(0x00000f, 0.022);

    const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 45);

    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.04;
    controls.autoRotate     = false;
    controls.autoRotateSpeed = 0.7;
    controls.enablePan      = false;
    controls.maxDistance    = 80;

    const renderScene = new RenderPass(scene, camera);
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.5, 0.4, 0.85);
    bloomPass.threshold = 1.08;
    bloomPass.strength  = 1.15;
    bloomPass.radius    = 0.55;

    const composer = new EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    const vertexShader = `
        attribute float aIsInput;
        varying vec2 vUv;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying float vIsInput;
        varying float vDist;

        void main() {
            vUv = uv;
            vIsInput = aIsInput;
            vec4 worldPos = modelMatrix * vec4(position, 1.0);
            vWorldPos = worldPos.xyz;
            vDist = length(worldPos.xyz);
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
        }
    `;

    const fragmentShader = `
        uniform float uTime;
        uniform float uPulseProgress;
        uniform float uActivation;
        uniform vec3 uCameraPos;

        varying vec2 vUv;
        varying vec3 vWorldPos;
        varying vec3 vNormal;
        varying float vIsInput;
        varying float vDist;

        float hash(vec3 p) {
            p = fract(p * 0.3183099 + .1);
            p *= 17.0;
            return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
        }
        float noise(vec3 x) {
            vec3 i = floor(x);
            vec3 f = fract(x);
            f = f*f*(3.0-2.0*f);
            return mix(
                mix(mix(hash(i+vec3(0,0,0)),hash(i+vec3(1,0,0)),f.x),
                    mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),

            return a + b * cos(6.28318*(c*t+d));

        void main() {
            vec3 viewDir = normalize(uCameraPos - vWorldPos);
            float facing = abs(dot(vNormal, viewDir));
            float fresnel = pow(1.0 - clamp(facing, 0.0, 1.0), 3.0);
            float n1 = noise(vWorldPos * 0.5 + uTime * 0.2);
            float n2 = noise(vWorldPos * 2.0 - uTime * 0.5);

            float veins = smoothstep(0.48, 0.62, noise(vWorldPos * vec3(1.8, 3.8, 1.4) + vec3(uTime * 0.05, 0.0, 0.0)));
            veins *= smoothstep(0.70, 0.35, abs(sin(vWorldPos.y * 1.15 + vWorldPos.x * 0.35)));
            float grain = noise(vWorldPos * 7.0 + uTime * 0.08);
            float heartbeat = 0.5 + 0.5 * sin(uTime * 2.8);
            float livingPulse = pow(heartbeat, 6.0) * 0.45;

            vec3 deepRed = vec3(0.34, 0.004, 0.016);
            vec3 warmRed = vec3(1.06, 0.014, 0.052);
            vec3 magenta = vec3(0.90, 0.032, 0.115);
            vec3 cyanEdge = vec3(0.0, 0.85, 1.0);

                float pi     = max(core * 3.4, trail * 1.9);

                float residual     = smoothstep(uActivation, uActivation - 25.0, vDist);
                float actIntensity = waveFront * 4.0 + residual * 1.5;

                vec3 dir    = normalize(vWorldPos);

    function createNeuralCurve(start, end, segments, spread, phase = 0) {

                tangent.x + (Math.random() - 0.5) * 0.7,
                (Math.random() - 0.5) * 1.4
            ).normalize();
            const branchLength = 3.2 + Math.random() * 4.8;
            const towardPhoto = end.clone().sub(branchStart).normalize().multiplyScalar(1.4 + j * 0.15);
            const branchEnd = branchStart.clone().add(branchSide.multiplyScalar(branchLength)).add(towardPhoto);
            const twig = createNeuralCurve(branchStart, branchEnd, 9, 0.34 + Math.random() * 0.25, i + j);
            addBranch(twig, (useMobileBubbleLayout ? 0.052 : 0.035) + Math.random() * 0.035, true, bubbleGroup);
        }
        return null;
    }

    function addBubbleNeuralFrame(bubble, i) {
        const framePts = [];
        for (let k = 0; k <= 120; k++) {
            const a = (k / 120) * Math.PI * 2;
            const wobble = 1 + Math.sin(k * 0.34 + i) * 0.035 + Math.sin(k * 0.71 + i * 0.4) * 0.018;
            framePts.push(new THREE.Vector3(Math.cos(a) * BUBBLE_FRAME_RADIUS * wobble, Math.sin(a) * BUBBLE_FRAME_RADIUS * wobble, 0.16));
        }
        addBranch(new THREE.CatmullRomCurve3(framePts, true), useMobileBubbleLayout ? 0.12 : 0.08, true, bubble);
        for (let j = 0; j < 4; j++) {
            const a = i * 0.45 + j * Math.PI * 0.5;
            const start = new THREE.Vector3(Math.cos(a) * BUBBLE_FRAME_RADIUS, Math.sin(a) * BUBBLE_FRAME_RADIUS, 0.16);
            const end = new THREE.Vector3(
                Math.cos(a + 0.22) * (3.85 + Math.random() * 0.65),
                Math.sin(a + 0.22) * (3.85 + Math.random() * 0.65),
                0.16 + (Math.random() - 0.5) * 0.2
            );
            addBranch(createNeuralCurve(start, end, 6, 0.12, i + j), useMobileBubbleLayout ? 0.052 : 0.034, true, bubble);
        }
    }

    // Toujours créer les 4 (ou 6) branches et bulles de lumière du cœur
    bubblePositions.forEach((pos, i) => {
        const bubble = new THREE.Group();
        bubble.position.copy(pos);
        const photoMat = new THREE.MeshBasicMaterial({
            color: useMobileBubbleLayout ? 0xf0eeee : 0xffffff, transparent: true, opacity: 0,
            side: THREE.DoubleSide, fog: false, toneMapped: true
        });
        if (bubblePhotos[i]) loader.load(bubblePhotos[i], texture => {
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
            texture.minFilter = THREE.LinearMipmapLinearFilter;
            texture.magFilter = THREE.LinearFilter;
            photoMat.map = texture;
            photoMat.opacity = 1;
            photoMat.needsUpdate = true;
        });
        const glow = new THREE.Mesh(glowGeo, glowMat.clone());
        const back = new THREE.Mesh(backGeo, backMat.clone());
        const photo = new THREE.Mesh(photoGeo, photoMat);
        const glass = new THREE.Mesh(glassGeo, glassMat.clone());
        const shine = new THREE.Mesh(shineGeo, shineMat.clone());
        back.position.z = -0.035;
        photo.position.z = 0.02;
        if (useMobileBubbleLayout) photo.scale.setScalar(0.91);
        glass.position.z = 0.08;
        shine.position.set(-0.82, 0.92, 0.16);
        shine.scale.set(useMobileBubbleLayout ? 0.72 : 1.1, useMobileBubbleLayout ? 0.16 : 0.28, 1);
        bubble.add(glow, back, photo, glass, shine);
        addBubbleNeuralFrame(bubble, i);
        addNeuralPhotoLink(pos, i);
        bubbleGroup.add(bubble);
        bubbleObjects.push({ bubble, photo, glow, glass, shine, base: pos.clone(), phase: i * 0.9 });
    });

    function makeParticles(count, spread, colorHex, size, opacity) {
        const geo = new THREE.BufferGeometry();
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * spread;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        return new THREE.Points(geo, new THREE.PointsMaterial({
            color: colorHex, size, transparent: true, opacity,
            blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true
        }));
    }

    const dustA = makeParticles(1200, 120, 0x224466, 0.08, 0.25);
    const dustB = makeParticles(400,  90, 0x003355, 0.16, 0.18);
    const dustC = makeParticles(120,  60, 0x00aacc, 0.30, 0.12);
    scene.add(dustA, dustB, dustC);

    const elMv     = document.getElementById('tele-mv');
    const elProp   = document.getElementById('tele-prop');
    const elSignal = document.getElementById('bar-signal');
    const elAxon   = document.getElementById('bar-axon');
    const elStatus = document.getElementById('status-msg');
    const elDot    = document.getElementById('status-dot');
    const elPanel  = document.getElementById('ui-panel');
    const elCoordX = document.getElementById('coord-x');
    const elCoordY = document.getElementById('coord-y');
    const elCoordZ = document.getElementById('coord-z');

    let state = 0;
    let pulseProg = -10.0;
    let actProg   = 0.0;
    const INPUT_LENGTH = 26.0;
    const PULSE_SPEED = 17.0;
    const ACTIVATION_SPEED = 12.5;
    let animOrbitTime = 0, animSwayBlend = 0, animBaseAngle = 0, animBaseRadius = 45, animBaseY = 8;
    let idleOrbitTime = 0, idleBaseAngle = 0, idleBaseRadius = 45, idleBaseY = 8;
    let clickAnimationFinished = false;
    let userIsControlling = false;
    let manualControlUntil = 0;
    let animationCameraLocked = false;

    function captureAnimationCameraBase() {
        const orbitOffset = camera.position.clone().sub(controls.target);
        animOrbitTime = idleOrbitTime;
        animSwayBlend = 0;
        animBaseAngle  = Math.atan2(orbitOffset.x, orbitOffset.z);
        animBaseRadius = Math.sqrt(orbitOffset.x * orbitOffset.x + orbitOffset.z * orbitOffset.z);
        animBaseY = camera.position.y;
    }

    controls.addEventListener('start', () => {
        userIsControlling = true;
        manualControlUntil = performance.now() + 1400;
        if (state !== 0) {
            animationCameraLocked = true;
            controls.autoRotate = false;
        }
    });
    controls.addEventListener('end',   () => {
        userIsControlling = false;
        manualControlUntil = performance.now() + 1400;
        if (state !== 0) {
            animationCameraLocked = true;
            captureAnimationCameraBase();
            controls.autoRotate = false;
        }
    });

    let mvBase = -70.0, mvTarget = -70.0;

    window.addEventListener('click', (event) => {
        if (performance.now() < (window.skipSceneActivationUntil || 0)) return;
        if (event.target.closest('#fullscreen-control, .music-control, button, input, a')) return;
        if (state !== 0) return;
        animationCameraLocked = false;
        state = 1; pulseProg = INPUT_LENGTH; actProg = 0.0;
        const orbitOffset = camera.position.clone().sub(controls.target);
        animOrbitTime = Math.max(animOrbitTime, idleOrbitTime);
        animBaseAngle  = Math.atan2(orbitOffset.x, orbitOffset.z);
        animBaseRadius = Math.sqrt(orbitOffset.x * orbitOffset.x + orbitOffset.z * orbitOffset.z);
        animBaseY = camera.position.y;
        controls.autoRotate = false;
        material.uniforms.uPulseProgress.value = pulseProg;
        material.uniforms.uActivation.value = 0.0;
        if (elPanel) elPanel.style.opacity = '0';
        document.body.classList.add('active');
        document.body.classList.add('music-visible');
        if (!window.musicAutoStarted && window.directMusicPlay) {
            window.musicAutoStarted = true;
            window.directMusicPlay();
        }
        setTimeout(() => document.body.classList.remove('active'), 450);
        mvTarget = 40.0;
    });

    const layoutState = { heartScale: 1.12 };

    function applyResponsiveLayout() {
        const mobile = innerWidth <= 700 || innerWidth / innerHeight < 0.72;
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
        composer.setSize(innerWidth, innerHeight);
        if (mobile) {
            layoutState.heartScale = 0.92;
            camera.position.z = Math.max(camera.position.z, 63);
            camera.position.y = 4.8;
            bubbleGroup.scale.set(1.03, 1.12, 1.0);
            bubbleGroup.position.y = 0.0;
            controls.target.set(0, 2, 0);
            controls.maxDistance = 92;
        } else {
            layoutState.heartScale = 1.12;
            bubbleGroup.scale.set(1, 1, 1);
            bubbleGroup.position.y = 0;
            controls.target.set(0, 1.3, 0);
            controls.maxDistance = 80;
        }
        if (state === 0 && !clickAnimationFinished) {
            const orbitOffset = camera.position.clone().sub(controls.target);
            idleBaseAngle  = Math.atan2(orbitOffset.x, orbitOffset.z);
            idleBaseRadius = Math.sqrt(orbitOffset.x * orbitOffset.x + orbitOffset.z * orbitOffset.z);
            idleBaseY = camera.position.y;
        }
        controls.update();
    }

    applyResponsiveLayout();
    window.addEventListener('resize', applyResponsiveLayout);

    const clock = new THREE.Clock();
    let frameCount = 0;

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        frameCount++;
        controls.update();
        dustA.rotation.y += delta * 0.008; dustA.rotation.x += delta * 0.003;
        dustB.rotation.y -= delta * 0.005; dustB.rotation.z += delta * 0.002;
        dustC.rotation.y += delta * 0.015;
        const beatTime = material.uniforms.uTime.value * 1.15;
        const beatPhase = beatTime - Math.floor(beatTime);
        const beatA = Math.exp(-Math.pow((beatPhase - 0.08) / 0.045, 2.0));
        const beatB = Math.exp(-Math.pow((beatPhase - 0.22) / 0.065, 2.0)) * 0.55;
        structureGroup.scale.setScalar(layoutState.heartScale + (beatA + beatB) * 0.03);
        heartTextMat.uniforms.uOpacity.value = 1;
        heartText.scale.setScalar(1 + Math.sin(material.uniforms.uTime.value * 1.6) * 0.012);
        heartTextOutline.scale.copy(heartText.scale);
        heartTextBack.scale.copy(heartText.scale);
        heartTextOutlineBack.scale.copy(heartText.scale);
        bubbleObjects.forEach(item => {
            item.bubble.position.copy(item.base);
            item.bubble.scale.setScalar(1 + Math.sin(material.uniforms.uTime.value * 2.0 + item.phase) * 0.025);
            item.glow.material.opacity  = state === 0 ? (useMobileBubbleLayout ? 0.036 : 0.055) : (useMobileBubbleLayout ? 0.070 : 0.12);
            item.glass.material.opacity = state === 0 ? (useMobileBubbleLayout ? 0.004 : 0.025) : (useMobileBubbleLayout ? 0.012 : 0.035);
            item.shine.material.opacity = state === 0 ? (useMobileBubbleLayout ? 0.038 : 0.18) : (useMobileBubbleLayout ? 0.070 : 0.18);
        });
        material.uniforms.uTime.value += delta;
        material.uniforms.uCameraPos.value.copy(camera.position);
        mvBase += (Math.random() - 0.5) * 0.4;
        mvBase = Math.max(-80, Math.min(-55, mvBase));
        mvTarget += (mvBase - mvTarget) * 0.05;
        if (state === 1) {
            pulseProg -= delta * PULSE_SPEED;
            material.uniforms.uPulseProgress.value = pulseProg;
            mvTarget = 40.0 * (1.0 - pulseProg / INPUT_LENGTH);
            if (pulseProg <= 2.0) {
                state = 2; pulseProg = -10.0;
                material.uniforms.uPulseProgress.value = -10.0;
                actProg = 0.0; camera.position.y += 0.5;
            }
        } else if (state === 2) {
            actProg += delta * ACTIVATION_SPEED;
            material.uniforms.uActivation.value = actProg;
            if (actProg > 75.0) {
                state = 0; material.uniforms.uActivation.value = 0.0;
                clickAnimationFinished = true; controls.autoRotate = false; mvTarget = -70.0;
            }
        }
        const allowCameraSway = !userIsControlling && performance.now() > manualControlUntil;
        if (state !== 0 && allowCameraSway && !animationCameraLocked) {
            animOrbitTime += delta;
            animSwayBlend = Math.min(1, animSwayBlend + delta * 1.4);
            const smoothBlend = animSwayBlend * animSwayBlend * (3 - 2 * animSwayBlend);
            const angle = animBaseAngle + Math.sin(animOrbitTime * 0.95) * 0.22 * smoothBlend;
            camera.position.set(
                controls.target.x + Math.sin(angle) * animBaseRadius,
                animBaseY + Math.sin(animOrbitTime * 0.55) * 0.22 * smoothBlend,
                controls.target.z + Math.cos(angle) * animBaseRadius
            );
            camera.lookAt(controls.target);
        } else if (!clickAnimationFinished && state === 0 && allowCameraSway) {
            idleOrbitTime += delta;
            const angle = idleBaseAngle + Math.sin(idleOrbitTime * 0.55) * 0.16;
            camera.position.set(
                controls.target.x + Math.sin(angle) * idleBaseRadius,
                idleBaseY + Math.sin(idleOrbitTime * 0.36) * 0.12,
                controls.target.z + Math.cos(angle) * idleBaseRadius
            );
            camera.lookAt(controls.target);
        }
        composer.render();
    }

    animate();
</script>

<script>
    var music = document.getElementById('backgroundMusic');
    var musicBtn = document.getElementById('musicBtn');
    var playIcon = document.getElementById('playIcon');
    var pauseIcon = document.getElementById('pauseIcon');
    var volumeSlider = document.getElementById('volumeSlider');
    var volumeControl = document.getElementById('volumeControl');
    var hideVolumeTimeout = null;
    var lastMusicToggleAt = -1000;

    function setMusicIcons(isPlaying) {
        if (playIcon) playIcon.style.display = isPlaying ? 'none' : 'block';
        if (pauseIcon) pauseIcon.style.display = isPlaying ? 'block' : 'none';
    }

    function revealMusicControl() {
        document.body.classList.add('music-visible');
        var musicControl = document.querySelector('.music-control');
        if (musicControl) musicControl.classList.add('is-visible');
    }

    function startBackgroundMusic() {
        if (!music) return;
        if (window.directMusicPlay) {
            window.directMusicPlay();
            return;
        }
        revealMusicControl();
        music.play().then(function() {
            setMusicIcons(true);
        }).catch(function() {
            setMusicIcons(false);
        });
    }

    window.startBackgroundMusic = startBackgroundMusic;

    function toggleMusic() {
        if (!music) return;
        revealMusicControl();
        lastMusicToggleAt = performance.now();
        if (music.paused) {
            startBackgroundMusic();
        } else {
            music.pause();
            setMusicIcons(false);
        }
    }

    if (music && volumeSlider) {
        music.volume = parseFloat(volumeSlider.value || '0.5');
        music.load();
        music.addEventListener('play', function() { setMusicIcons(true); });
        music.addEventListener('pause', function() { setMusicIcons(false); });
        music.addEventListener('error', function() { setMusicIcons(false); });
    }
    setMusicIcons(false);

    function handleMusicButtonPress(e) {
        e.stopPropagation();
        e.preventDefault();
        if (performance.now() - lastMusicToggleAt < 250) return;
        toggleMusic();
        if (volumeControl && !volumeControl.classList.contains('visible')) {
            volumeControl.classList.add('visible');
            clearTimeout(hideVolumeTimeout);
            hideVolumeTimeout = setTimeout(function() { volumeControl.classList.remove('visible'); }, 2000);
        } else if (volumeControl) {
            volumeControl.classList.remove('visible');
        }
    }
    if (musicBtn) {
        musicBtn.addEventListener('click', handleMusicButtonPress);
    }
    if (volumeSlider) {
        volumeSlider.addEventListener('input', function(e) {
            var volume = parseFloat(e.target.value);
            if (music) music.volume = volume;
            clearTimeout(hideVolumeTimeout);
            if (volumeControl) volumeControl.classList.add('visible');
        });
        volumeSlider.addEventListener('change', function() {
            hideVolumeTimeout = setTimeout(function() { if (volumeControl) volumeControl.classList.remove('visible'); }, 2000);
        });
    }
    if (volumeControl) {
        volumeControl.addEventListener('mouseenter', function() { clearTimeout(hideVolumeTimeout); });
        volumeControl.addEventListener('mouseleave', function() {
            hideVolumeTimeout = setTimeout(function() { volumeControl.classList.remove('visible'); }, 2000);
        });
    }
    if (volumeSlider) {
        volumeSlider.addEventListener('touchstart', function(e) { e.stopPropagation(); clearTimeout(hideVolumeTimeout); });
        volumeSlider.addEventListener('touchend', function() {
            hideVolumeTimeout = setTimeout(function() { if (volumeControl) volumeControl.classList.remove('visible'); }, 2000);
        });
    }
    document.addEventListener('click', function(e) {
        if (volumeControl && !volumeControl.contains(e.target) && musicBtn && !musicBtn.contains(e.target)) {
            volumeControl.classList.remove('visible');
            clearTimeout(hideVolumeTimeout);
        }
    });
</script>

<script>
    var fullscreenBtn = document.getElementById('fullscreenBtn');
    var fullscreenEnterIcon = document.getElementById('fullscreenEnterIcon');
    var fullscreenExitIcon = document.getElementById('fullscreenExitIcon');
    var fullscreenControl = document.getElementById('fullscreen-control');

    function getFullscreenElement() {
        return document.fullscreenElement || document.webkitFullscreenElement || document.msFullscreenElement || null;
    }
    function isFullscreenSupported() {
        return Boolean(document.fullscreenEnabled || document.webkitFullscreenEnabled || document.msFullscreenEnabled ||
            document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen || document.documentElement.msRequestFullscreen);
    }
    function syncFullscreenButtonState() {
        var active = !!getFullscreenElement();
        if (fullscreenEnterIcon) fullscreenEnterIcon.style.display = active ? 'none' : 'block';
        if (fullscreenExitIcon) fullscreenExitIcon.style.display = active ? 'block' : 'none';
        var label = active ? "Exit fullscreen" : "Plein écran";
        if (fullscreenBtn) {
            fullscreenBtn.setAttribute('aria-label', label);
            fullscreenBtn.title = label;
        }
    }
    if (!isFullscreenSupported()) {
        if (fullscreenControl) fullscreenControl.style.display = 'none';
    } else {
        syncFullscreenButtonState();
        document.addEventListener('fullscreenchange', syncFullscreenButtonState);
        document.addEventListener('webkitfullscreenchange', syncFullscreenButtonState);
        document.addEventListener('msfullscreenchange', syncFullscreenButtonState);
    }
</script>
