<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>

:root{
  --burgundy:#3a0a14;--burgundy-deep:#1a0509;--wine:#5c0f1f;--rose:#c1294a;
  --rose-soft:#e8a4b0;--blush:#f5d5d8;--cream:#f8ebe4;--paper:#fbf4ed;
  --paper-ink:#2a1018;--gold:#c9a25f;--gold-deep:#8a6a30;
  --scan-red:#ff315f;--scan-red-deep:#b90f36;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Cormorant Garamond',serif;background:#1a0509;color:var(--cream);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
img{display:block;max-width:100%}

/* ============ SCROLLBAR ============ */
html{scrollbar-width:thin;scrollbar-color:var(--rose) rgba(26,5,9,.6);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:rgba(26,5,9,.6);}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#ff4d6d,#c1294a);border-radius:999px;border:2px solid rgba(26,5,9,.85);}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ff6b85,#d63a5c);}
::-webkit-scrollbar-corner{background:transparent;}
.letter{scrollbar-color:rgba(193,41,74,.55) transparent;}
.letter::-webkit-scrollbar{width:8px;}
.letter::-webkit-scrollbar-track{background:transparent;}
.letter::-webkit-scrollbar-thumb{background:rgba(193,41,74,.45);border:2px solid transparent;background-clip:padding-box;}
.letter::-webkit-scrollbar-thumb:hover{background:rgba(193,41,74,.7);background-clip:padding-box;}

/* ============ FINGERPRINT GATE ============ */
.fp-gate{
  position:fixed;inset:0;z-index:9000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.2rem;padding:2rem;
  background:radial-gradient(ellipse at center,#2a060e 0%,#15030a 70%,#0a0105 100%);
  user-select:none;-webkit-tap-highlight-color:transparent;
  transition:opacity 1.2s ease-in;
}
.fp-gate.hidden{opacity:0;pointer-events:none}
.fp-gate .subtitle{
  font-family:'Pinyon Script',cursive;font-size:clamp(2.8rem,7vw,4.4rem);
  color:var(--cream);line-height:1;text-shadow:0 0 30px rgba(193,41,74,.4);text-align:center;
}
.fp-wrap{position:relative;width:min(78vw,300px);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;margin:1rem 0;touch-action:none;}
.fp-pulse{position:absolute;inset:-20px;border-radius:50%;border:1px solid rgba(232,164,176,.25);animation:fpPulse 2.4s ease-out infinite;}
.fp-pulse:nth-child(2){animation-delay:.8s}.fp-pulse:nth-child(3){animation-delay:1.6s}
@keyframes fpPulse{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.25);opacity:0}}
.fp-ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(248,235,228,.14);
  background:radial-gradient(circle at center,rgba(18,1,6,.98) 0%,rgba(28,2,9,.96) 48%,rgba(7,0,3,.94) 100%);
  box-shadow:inset 0 0 42px rgba(0,0,0,.5),inset 0 0 76px rgba(193,41,74,.2),0 0 0 1px rgba(212,165,116,.12),0 22px 70px rgba(0,0,0,.34);
  transition:box-shadow .4s,background .4s;}
.fp-ring::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid rgba(248,235,228,.08);box-shadow:inset 0 0 28px rgba(248,235,228,.04);}
.fp-svg{position:relative;width:72%;height:92%;z-index:2;color:var(--rose-soft);filter:drop-shadow(0 0 2px rgba(255,248,241,.45)) drop-shadow(0 0 12px rgba(248,235,228,.24));}
.fp-img{display:block;object-fit:contain;opacity:.68;mix-blend-mode:screen;}
.fp-tint{position:absolute;left:50%;top:50%;width:72%;height:92%;transform:translate(-50%,-50%);z-index:2;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,#fff8ec 0%,var(--scan-red) 24%,#ef123f 62%,var(--scan-red-deep) 100%);
  clip-path:inset(0 0 100% 0);
  filter:drop-shadow(0 0 8px rgba(255,248,236,.8)) drop-shadow(0 0 18px rgba(255,49,95,.72)) drop-shadow(0 0 32px rgba(185,15,54,.58));
  -webkit-mask:url("/images/lector-huellas/fingerprint-real.svg") center / contain no-repeat;mask:url("/images/lector-huellas/fingerprint-real.svg") center / contain no-repeat;}
.fp-scan{position:absolute;left:12%;right:12%;top:50%;height:3px;border-radius:999px;
  background:linear-gradient(90deg,transparent 0%,rgba(185,15,54,.35) 10%,#ff2d5d 28%,#ff5f82 50%,#ff2d5d 72%,rgba(185,15,54,.35) 90%,transparent 100%);
  box-shadow:0 0 8px rgba(255,95,130,.92),0 0 22px rgba(255,45,93,.78),0 0 42px rgba(185,15,54,.56);
  opacity:0;transform:translateY(-50%);z-index:3;pointer-events:none;}
.fp-progress{position:absolute;inset:-13.75% -22.5%;overflow:visible;transform:rotate(-90deg);pointer-events:none;z-index:2;}
.fp-progress ellipse{fill:none;stroke-linecap:round;}
.fp-progress .bar{stroke:#ff315f;stroke-width:2.8;stroke-dasharray:1000;stroke-dashoffset:1000;
  filter:drop-shadow(0 0 6px rgba(255,49,95,.95)) drop-shadow(0 0 18px rgba(185,15,54,.62));transition:stroke-dashoffset .1s linear;}
.fp-gate.is-scanning .fp-svg{color:var(--cream);}
.fp-gate.is-scanning .fp-img{opacity:.28;}
.fp-gate.is-scanning .fp-scan{opacity:1;animation:fpScanline 2.35s ease-in-out infinite;}
.fp-gate.is-scanning .fp-tint{opacity:1;animation:fpTintScan 2.35s ease-in-out infinite;}
@keyframes fpScanline{0%{top:20%}50%{top:80%}100%{top:20%}}
@keyframes fpTintScan{0%{clip-path:inset(0 0 82% 0)}50%{clip-path:inset(0 0 18% 0)}100%{clip-path:inset(0 0 82% 0)}}
.fp-gate.is-success .fp-svg{color:var(--cream);filter:drop-shadow(0 0 14px rgba(248,235,228,.85));}
.fp-gate.is-success .fp-tint{opacity:1;clip-path:inset(0 0 0 0);}
.fp-hint{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.15rem,2.6vw,1.45rem);color:var(--cream);letter-spacing:.03em;text-align:center;min-height:1.6em;transition:opacity .4s,color .4s;}
.fp-hint .heart{display:inline-block;color:var(--rose);transform:translateY(.05em);}
.fp-gate.is-success .fp-hint{font-family:'Pinyon Script',cursive;font-size:clamp(1.8rem,4vw,2.4rem);font-style:normal;text-shadow:0 0 24px rgba(232,164,176,.6);}

/* ============ MUSIC CONTROL (custom) ============ */
.music-control{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;align-items:center;}
.music-btn{width:50px;height:50px;background:linear-gradient(135deg,#ff4d6d,#e6395c);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 15px rgba(0,0,0,.4);transition:all .3s ease;}
.music-btn:hover{transform:scale(1.1);box-shadow:0 8px 20px rgba(255,77,109,.6);}
.music-btn:active{transform:scale(.95);}
.music-btn svg{width:24px;height:24px;fill:#fff;}
.volume-control{width:120px;background:rgba(255,255,255,.15);padding:10px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.4);border:1px solid rgba(255,77,109,.5);margin-top:10px;display:none;opacity:0;transform:translateY(-10px);transition:opacity .3s ease,transform .3s ease;}
.volume-control.visible{display:block;opacity:1;transform:translateY(0);}
.volume-control input{width:100%;height:8px;background:rgba(255,255,255,.3);border-radius:4px;outline:none;cursor:pointer;-webkit-appearance:none;}
.volume-control input::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:#ff4d6d;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.volume-control input::-moz-range-thumb{width:16px;height:16px;background:#ff4d6d;border-radius:50%;box-shadow:0 2px 5px rgba(0,0,0,.3);border:none;}
@media (max-width:768px){.music-control{right:15px}.music-btn{width:35px;height:35px}.music-btn svg{width:22px;height:22px}.volume-control{width:100px;margin-top:8px}}

/* ============ AMBIENT ============ */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none}
.ambient::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 15% 10%,rgba(193,41,74,.18) 0%,transparent 45%),radial-gradient(ellipse at 85% 90%,rgba(201,162,95,.12) 0%,transparent 50%),radial-gradient(ellipse at center,#2a060e 0%,#14030a 80%);}
.petals{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.petal{position:absolute;top:-40px;width:18px;height:18px;background:radial-gradient(circle at 30% 30%,var(--rose-soft) 0%,var(--rose) 60%,var(--wine) 100%);border-radius:80% 0 80% 0;opacity:.7;filter:blur(.3px);animation:fall linear infinite;}
@keyframes fall{0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}10%{opacity:.7}90%{opacity:.6}100%{transform:translate3d(60px,110vh,0) rotate(720deg);opacity:0}}

/* ============ LAYOUT ============ */
main{position:relative;z-index:2}
section{position:relative;padding:5rem 1.5rem;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.wrap{width:100%;max-width:1100px;margin:0 auto}
.reveal{opacity:0;transform:translateY(28px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1);}
.reveal.in{opacity:1;transform:none}
.reveal[data-delay="1"]{transition-delay:.12s}.reveal[data-delay="2"]{transition-delay:.24s}.reveal[data-delay="3"]{transition-delay:.36s}.reveal[data-delay="4"]{transition-delay:.48s}
.eyebrow{font-family:'Cinzel',serif;font-size:clamp(.75rem,1.4vw,.9rem);letter-spacing:.5em;text-transform:uppercase;color:var(--rose-soft);opacity:.75;text-align:center;}
.ornament-rule{display:flex;align-items:center;justify-content:center;gap:1rem;color:var(--gold);margin:1.5rem 0;}
.ornament-rule .line{width:5rem;height:1px;background:linear-gradient(to right,transparent,var(--gold),transparent);}
.ornament-rule .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold);}

/* ============ HERO ============ */
.hero{position:relative;min-height:100dvh;height:100dvh;padding-top:3.5rem;padding-bottom:3.5rem;overflow:hidden;}
.hero-roses{position:absolute;bottom:0;height:100%;width:auto;max-width:none;object-fit:contain;pointer-events:none;z-index:1;filter:drop-shadow(0 0 40px rgba(193,41,74,.35));animation:rosesFloat 8s ease-in-out infinite;}
.hero-roses-right{right:-2vw;object-position:right bottom;-webkit-mask-image:linear-gradient(to left,black 60%,transparent 100%);mask-image:linear-gradient(to left,black 60%,transparent 100%);}
.hero-roses-left{left:-2vw;object-position:left bottom;-webkit-mask-image:linear-gradient(to right,black 60%,transparent 100%);mask-image:linear-gradient(to right,black 60%,transparent 100%);}
.hero-roses-top{display:none;position:absolute;top:0;left:0;width:100%;height:38vh;object-fit:cover;object-position:top center;max-width:none;pointer-events:none;z-index:1;-webkit-mask-image:linear-gradient(to bottom,black 60%,transparent 100%);mask-image:linear-gradient(to bottom,black 60%,transparent 100%);}
.hero-roses-bottom{display:none;position:absolute;bottom:0;left:0;width:100%;height:38vh;object-fit:cover;object-position:bottom center;max-width:none;pointer-events:none;z-index:1;-webkit-mask-image:linear-gradient(to top,black 60%,transparent 100%);mask-image:linear-gradient(to top,black 60%,transparent 100%);}
@keyframes rosesFloat{0%,100%{transform:translateX(0)}50%{transform:translateX(-4px)}}
.hero .wrap{position:relative;z-index:2;min-height:calc(100dvh - 7rem);display:flex;flex-direction:column;align-items:center;justify-content:center;}
@media (max-width:900px){.hero-roses-left,.hero-roses-right{display:none}.hero-roses-top{display:block;opacity:.85}.hero-roses-bottom{display:block;opacity:.9}}
.hero .eyebrow{margin-bottom:1.5rem}
.hero-title{font-family:'Pinyon Script',cursive;font-size:clamp(5rem,20vw,9.5rem);line-height:1.05;padding-bottom:.12em;text-align:center;color:var(--cream);text-shadow:0 0 40px rgba(232,164,176,.35);}
.hero-title .amp{display:inline-block;color:var(--rose);margin:0 .1em;font-style:italic;}
/* Cae sobre las rosas iluminadas del fondo, asi que ademas del resplandor
   lleva un velo oscuro difuminado detras para despegarlo de la foto. */
.hero-sub{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(1.65rem,3.8vw,2.6rem);letter-spacing:.04em;color:var(--cream);text-align:center;margin-top:.7rem;}
.hero-sub span{position:relative;display:inline-block;padding:.1em .8em;text-shadow:0 1px 4px rgba(26,5,9,.7),0 0 14px rgba(26,5,9,.5);}
.hero-sub span::before{content:'';position:absolute;inset:-.15em -.1em;background:radial-gradient(ellipse at center,rgba(26,5,9,.6) 0%,rgba(26,5,9,.4) 48%,rgba(26,5,9,0) 78%);filter:blur(7px);z-index:-1;pointer-events:none;}
.counter{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.7rem;margin:2.1rem auto 0;max-width:680px;}
.counter .unit{border:1px solid rgba(201,162,95,.4);border-radius:4px;padding:1.3rem .4rem 1.1rem;text-align:center;background:rgba(26,5,9,.4);backdrop-filter:blur(4px);}
.counter .num{font-family:'DM Serif Display','Playfair Display',serif;font-size:clamp(2.2rem,5.4vw,3.4rem);color:var(--cream);font-variant-numeric:tabular-nums;line-height:1;}
.counter .label{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.32em;color:var(--rose-soft);text-transform:uppercase;margin-top:.7rem;opacity:.85;}
.scroll-hint{position:absolute;bottom:2.2rem;left:50%;transform:translateX(-50%);color:var(--rose-soft);opacity:.65;animation:bob 2.4s ease-in-out infinite;}
.scroll-hint svg{width:24px;height:24px;display:block}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

.section-head{text-align:center;margin-bottom:2.5rem;}
.section-head h2{font-family:'Pinyon Script',cursive;font-size:clamp(2.8rem,7vw,4.6rem);color:var(--cream);line-height:1;}

/* ============ DEDICATORIA ============ */
.dedicatoria .body{max-width:680px;margin:0 auto;text-align:center;}
.dedicatoria p{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(1.2rem,2.4vw,1.6rem);line-height:1.65;color:var(--cream);margin-bottom:1.2rem;}
.dedicatoria .sign{font-family:'Pinyon Script',cursive;font-size:2.4rem;color:var(--rose-soft);margin-top:1.5rem;}

/* ============ GALERIA ============ */
.gallery{position:relative;max-width:980px;margin:0 auto;padding:1rem 0 2rem;}
.gal-viewport{overflow:hidden;padding:2.5rem 0;}
.gal-track{display:flex;gap:2rem;will-change:transform;transition:transform .55s cubic-bezier(.2,.7,.2,1);}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);z-index:6;width:48px;height:48px;border-radius:50%;border:1px solid rgba(232,164,176,.4);background:rgba(58,10,20,.55);color:var(--rose-soft);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(6px);transition:background .3s,transform .3s;}
.gal-prev{left:.6rem}.gal-next{right:.6rem}
.gal-nav:hover{background:rgba(193,41,74,.5);transform:translateY(-50%) scale(1.08);}
.gal-nav svg{width:22px;height:22px}
.polaroid{flex:0 0 auto;width:clamp(240px,30vw,300px);background:var(--paper);padding:12px 12px 14px;box-shadow:0 28px 50px rgba(0,0,0,.55);position:relative;transition:transform .5s cubic-bezier(.2,.7,.2,1),box-shadow .5s;}
.polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:54px;height:18px;background:rgba(232,164,176,.35);border:1px solid rgba(232,164,176,.25);transform:translateX(-50%) rotate(-2deg);box-shadow:0 4px 8px rgba(0,0,0,.25);}
.polaroid:hover{transform:translateY(-10px) scale(1.04);box-shadow:0 50px 90px rgba(0,0,0,.7);z-index:5;}
.polaroid .photo{aspect-ratio:4/5;overflow:hidden;position:relative;background:#2a060e;}
.polaroid .photo img{width:100%;height:100%;object-fit:cover;filter:sepia(.28) saturate(1.05) contrast(1.04) brightness(.96);transition:filter .6s,transform .6s;}
.polaroid:hover .photo img{filter:sepia(.15) saturate(1.1) brightness(1);transform:scale(1.04);}
.polaroid figcaption{display:block;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:1.15rem;color:var(--wine);margin-top:14px;line-height:1.25;padding:2px 4px 6px;}
@media (max-width:720px){.gal-nav{width:42px;height:42px}.gal-track{gap:1rem}.polaroid{width:80vw;max-width:340px}}

/* ============ TIMELINE ============ */
.timeline{position:relative;max-width:680px;margin:0 auto;padding:.5rem 0;display:flex;flex-direction:column;}
.tl-connector{width:1px;height:42px;margin:0 auto;background:linear-gradient(to bottom,transparent,var(--gold),transparent);opacity:.6;}
.tl-node{width:28px;height:28px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 30% 30%,var(--rose) 0%,var(--wine) 70%,var(--burgundy-deep) 100%);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--cream);box-shadow:0 0 0 4px var(--burgundy-deep),0 0 20px rgba(193,41,74,.6);position:relative;z-index:2;}
.tl-card{position:relative;background:linear-gradient(180deg,rgba(58,10,20,.6) 0%,rgba(26,5,9,.82) 100%);border:1px solid rgba(201,162,95,.3);border-radius:6px;padding:1.2rem;display:grid;grid-template-columns:120px 1fr;gap:1.4rem;align-items:center;box-shadow:0 24px 50px rgba(0,0,0,.55);backdrop-filter:blur(4px);transition:transform .5s cubic-bezier(.2,.7,.2,1),border-color .5s;}
.tl-card.no-img{grid-template-columns:1fr;}
.tl-card:hover{transform:translateY(-3px);border-color:var(--gold);}
.tl-thumb{width:120px;height:144px;overflow:hidden;border-radius:3px;position:relative;background:#2a060e;box-shadow:0 6px 14px rgba(0,0,0,.5);}
.tl-thumb img{width:100%;height:100%;object-fit:cover;filter:sepia(.3) saturate(1.08) brightness(.95);transition:transform .6s,filter .6s;}
.tl-card:hover .tl-thumb img{transform:scale(1.06);filter:sepia(.15) brightness(1);}
.tl-content{min-width:0}
.tl-date{font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;margin-bottom:.5rem;}
.tl-title{font-family:'Playfair Display',serif;font-style:italic;font-size:1.35rem;font-weight:600;color:var(--cream);margin-bottom:.4rem;line-height:1.15;}
.tl-body{font-family:'Cormorant Garamond',serif;font-size:1.05rem;line-height:1.5;color:var(--rose-soft);}
@media (max-width:560px){.tl-card{grid-template-columns:1fr;text-align:center;padding:1.4rem 1.2rem;gap:1rem}.tl-thumb{margin:0 auto;width:110px;height:132px}}

/* ============ CARTA ============ */
.envelope-stage{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;}
.envelope-frame{position:relative;width:min(420px,90vw);z-index:2;}
.envelope-stage.open .envelope-frame{z-index:20;}
.letter{position:fixed;left:50%;top:50%;width:min(540px,94vw);max-height:90dvh;overflow-y:auto;z-index:30;background-color:#fbf4ed;color:var(--paper-ink);padding:3rem 2.4rem 2.6rem;border-radius:4px;box-shadow:0 30px 70px rgba(0,0,0,.7);font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.2rem;line-height:1.65;background-image:linear-gradient(rgba(58,33,41,.07) 1px,transparent 1px);background-size:100% 1.7em;background-position:0 2.6em;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .6s ease-out;}
.envelope-stage.open .letter{transform:translate(-50%,-50%) scale(1);opacity:1;pointer-events:auto;transition-delay:.35s,.4s;}
.envelope-stage::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(26,5,9,.5) 0%,rgba(15,2,6,.82) 100%);opacity:0;pointer-events:none;z-index:1;transition:opacity .8s ease-out;}
.envelope-stage.open::before{opacity:1;pointer-events:auto;}
.letter h3{font-family:'Pinyon Script',cursive;font-size:clamp(2rem,5.5vw,2.6rem);color:var(--wine);text-align:center;margin-bottom:1.2rem;line-height:1;}
.letter p{margin-bottom:1rem}
.letter .signoff{margin-top:1.6rem;text-align:right;font-family:'Pinyon Script',cursive;font-size:clamp(1.6rem,4.5vw,2.1rem);color:var(--wine);}
.letter-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--gold-deep);color:var(--wine);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .3s,transform .3s;z-index:10;}
.letter-close:hover{background:var(--wine);color:var(--cream);transform:scale(1.08)}
.envelope{position:relative;width:100%;aspect-ratio:7/5;cursor:pointer;z-index:2;perspective:1400px;user-select:none;}

  const scanAudio = new Audio("/images/lector-huellas/scan.wav"); scanAudio.loop = true; scanAudio.preload='auto';
  const failAudio = new Audio("/images/lector-huellas/fail.wav"); failAudio.preload='auto';
  const completeAudio = new Audio("/images/lector-huellas/complete.wav"); completeAudio.preload='auto';

  const HOLD_MS = 2600;
  let pressing=false, startTs=0, raf=0, done=false;

  function setMsg(elapsed){let m=null;for(const x of FP_MESSAGES){if(elapsed>=x.at)m=x;}if(m)hint.textContent=m.text;}
  function tick(){
    if(!pressing||done)return;
    const elapsed=performance.now()-startTs;
    const pct=Math.min(1,elapsed/HOLD_MS);
    bar.style.strokeDashoffset=1000-(1000*pct);
    setMsg(elapsed);
    if(pct>=1){success();return;}
    raf=requestAnimationFrame(tick);
  }
  function startPress(e){
    if(done||pressing)return;
    e.preventDefault();
    pressing=true;startTs=performance.now();
    gate.classList.add('is-scanning');
    hint.innerHTML=FP_MESSAGES[0].text;
    scanAudio.currentTime=0;scanAudio.play().catch(()=>{});
    raf=requestAnimationFrame(tick);
  }
  function endPress(){
    if(done||!pressing)return;
    pressing=false;cancelAnimationFrame(raf);
    gate.classList.remove('is-scanning');
    scanAudio.pause();scanAudio.currentTime=0;
    failAudio.currentTime=0;failAudio.play().catch(()=>{});
    bar.style.transition='stroke-dashoffset .6s ease';bar.style.strokeDashoffset=1000;
    setTimeout(()=>{bar.style.transition='stroke-dashoffset .1s linear';},650);
    hint.textContent=HUELLAS_CONFIG.hint||"";
  }
  function success(){
    done=true;pressing=false;cancelAnimationFrame(raf);
    bar.style.strokeDashoffset=0;
    gate.classList.remove('is-scanning');
    scanAudio.pause();scanAudio.currentTime=0;
    completeAudio.currentTime=0;completeAudio.play().catch(()=>{});
    gate.classList.add('is-success');
    hint.textContent=FP_SUCCESS;
    // arrancar música de fondo al desbloquear
    const bgMusique=document.getElementById('backgroundMusic');
    if(bgMusique){bgMusique.play().then(()=>window.__musicSetPlaying&&window.__musicSetPlaying(true)).catch(()=>{});}
    setTimeout(()=>{hint.textContent=FP_WELCOME;},1100);
    setTimeout(()=>{gate.classList.add('hidden');document.body.style.overflow='';},2200);
  }
  document.body.style.overflow='hidden';
  fp.addEventListener('mousedown',startPress);
  fp.addEventListener('touchstart',startPress,{passive:false});
  window.addEventListener('mouseup',endPress);
  window.addEventListener('touchend',endPress);
  window.addEventListener('touchcancel',endPress);
  fp.addEventListener('mouseleave',endPress);
  fp.addEventListener('keydown',e=>{if((e.key===' '||e.key==='Enter')&&!pressing)startPress(e);});
  fp.addEventListener('keyup',e=>{if(e.key===' '||e.key==='Enter')endPress();});
})();

/* ============ MUSIC CONTROL ============ */
(function(){
  const music=document.getElementById('backgroundMusic');
  const musicBtn=document.getElementById('musicBtn');
  const playIcon=document.getElementById('playIcon');
  const pauseIcon=document.getElementById('pauseIcon');
  const volumeSlider=document.getElementById('volumeSlider');
  const volumeControl=document.getElementById('volumeControl');
  if(!music||!musicBtn)return;
  let hideTimeout=null;
  music.volume=volumeSlider.value;
  window.__musicSetPlaying=function(p){playIcon.style.display=p?'none':'block';pauseIcon.style.display=p?'block':'none';};
  function toggle(){
    if(music.paused){music.play().then(()=>window.__musicSetPlaying(true)).catch(()=>{});}
    else{music.pause();window.__musicSetPlaying(false);}
  }
  musicBtn.addEventListener('click',e=>{
    e.stopPropagation();toggle();
    if(!volumeControl.classList.contains('visible')){volumeControl.classList.add('visible');clearTimeout(hideTimeout);hideTimeout=setTimeout(()=>volumeControl.classList.remove('visible'),2000);}
    else{volumeControl.classList.remove('visible');}
  });
  volumeSlider.addEventListener('input',e=>{music.volume=e.target.value;clearTimeout(hideTimeout);volumeControl.classList.add('visible');});
  volumeSlider.addEventListener('change',()=>{hideTimeout=setTimeout(()=>volumeControl.classList.remove('visible'),2000);});
  volumeControl.addEventListener('mouseenter',()=>clearTimeout(hideTimeout));
  volumeControl.addEventListener('mouseleave',()=>{hideTimeout=setTimeout(()=>volumeControl.classList.remove('visible'),2000);});
  document.addEventListener('click',e=>{if(!volumeControl.contains(e.target)&&!musicBtn.contains(e.target)){volumeControl.classList.remove('visible');clearTimeout(hideTimeout);}});
})();

/* ============ GALERIA CARRUSEL ============ */
(function(){
  const track=document.getElementById('galTrack');const prev=document.getElementById('galPrev');const next=document.getElementById('galNext');
  if(!track||!prev||!next)return;
  let busy=false;
  function step(){const f=track.firstElementChild;if(!f)return 0;const gap=parseFloat(getComputedStyle(track).gap)||0;return f.getBoundingClientRect().width+gap;}
  function goNext(){if(busy)return;busy=true;const d=step();track.style.transition='transform .55s cubic-bezier(.2,.7,.2,1)';track.style.transform=`translateX(${-d}px)`;track.addEventListener('transitionend',function h(){track.removeEventListener('transitionend',h);track.appendChild(track.firstElementChild);track.style.transition='none';track.style.transform='translateX(0)';void track.offsetWidth;busy=false;});}
  function goPrev(){if(busy)return;busy=true;const d=step();track.insertBefore(track.lastElementChild,track.firstElementChild);track.style.transition='none';track.style.transform=`translateX(${-d}px)`;void track.offsetWidth;track.style.transition='transform .55s cubic-bezier(.2,.7,.2,1)';track.style.transform='translateX(0)';setTimeout(()=>{busy=false;},560);}
  next.addEventListener('click',goNext);prev.addEventListener('click',goPrev);
})();

/* ============ PETALS ============ */
(function(){const wrap=document.getElementById('petals');for(let i=0;i<22;i++){const p=document.createElement('div');p.className='petal';const dur=14+Math.random()*18;p.style.left=(Math.random()*100)+'vw';p.style.animationDuration=dur+'s';p.style.animationDelay=(-Math.random()*dur)+'s';const sc=.5+Math.random()*1.4;p.style.transform=`scale(${sc})`;p.style.opacity=(.4+Math.random()*.4).toFixed(2);wrap.appendChild(p);}})();

/* ============ COUNTER ============ */
(function(){
  const start=new Date(COUNTER_START+'T00:00:00').getTime();
  const d=document.getElementById('cDays'),h=document.getElementById('cHours'),m=document.getElementById('cMins'),s=document.getElementById('cSecs');
  if(isNaN(start)||!d)return;
  function pad(n){return String(n).padStart(2,'0')}
  /* Con fecha futura cuenta regresiva, con fecha pasada tiempo transcurrido. */
  function tick(){let diff=Math.abs(Date.now()-start);const days=Math.floor(diff/86400000);diff-=days*86400000;const hrs=Math.floor(diff/3600000);diff-=hrs*3600000;const mins=Math.floor(diff/60000);diff-=mins*60000;const secs=Math.floor(diff/1000);d.textContent=days;h.textContent=pad(hrs);m.textContent=pad(mins);s.textContent=pad(secs);}
  tick();setInterval(tick,1000);
})();

/* ============ REVEAL ============ */
(function(){const els=document.querySelectorAll('.reveal');const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.12,rootMargin:'0px 0px -40px 0px'});els.forEach(el=>io.observe(el));})();

/* ============ SCROLL PROGRESS ============ */
(function(){const bar=document.getElementById('progressBar');function up(){const max=document.documentElement.scrollHeight-window.innerHeight;const p=Math.min(1,Math.max(0,window.scrollY/max));bar.style.width=(p*100)+'%';}up();window.addEventListener('scroll',up,{passive:true});window.addEventListener('resize',up);})();

/* ============ ENVELOPE ============ */
(function(){
  const stage=document.getElementById('envStage');const env=document.getElementById('envelope');const closeBtn=document.getElementById('letterClose');const letter=document.getElementById('letter');
  if(!stage||!env)return;
  function open(){if(stage.classList.contains('open'))return;stage.classList.add('open');letter.setAttribute('aria-hidden','false');}
  function close(){if(!stage.classList.contains('open'))return;stage.classList.remove('open');letter.setAttribute('aria-hidden','true');}
  env.addEventListener('click',open);
  env.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});
  closeBtn.addEventListener('click',e=>{e.stopPropagation();close();});
  document.addEventListener('click',e=>{if(!stage.classList.contains('open'))return;if(stage.contains(e.target))return;close();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stage.classList.contains('open'))close();});
})();

/* ============ CONFETTI ============ */
(function(){
  const canvas=document.getElementById('confetti');if(!canvas)return;const ctx=canvas.getContext('2d');
  let W=canvas.width=innerWidth,H=canvas.height=innerHeight;
  addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight;});
  const parts=[];const colors=['#c1294a','#e8a4b0','#f5d5d8','#c9a25f','#8e0e26'];
  function burst(n){for(let i=0;i<n;i++){parts.push({x:Math.random()*W,y:-20-Math.random()*200,vx:(Math.random()-.5)*1.6,vy:1.2+Math.random()*2.4,a:Math.random()*Math.PI*2,va:(Math.random()-.5)*.12,s:4+Math.random()*7,c:colors[Math.floor(Math.random()*colors.length)],life:0,max:320+Math.random()*220});}}
  let running=false;
  function loop(){if(!running)return;ctx.clearRect(0,0,W,H);for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.a+=p.va;p.life++;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*1.6,0,0,Math.PI*2);ctx.fill();ctx.restore();if(p.y>H+50||p.life>p.max)parts.splice(i,1);}if(parts.length>0)requestAnimationFrame(loop);else running=false;}
  function fire(){if(running)return;running=true;burst(80);setTimeout(()=>burst(60),400);setTimeout(()=>burst(50),900);requestAnimationFrame(loop);}
  const finalSec=document.getElementById('finalSec');
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){fire();io.unobserve(finalSec);}});},{threshold:.35});
  io.observe(finalSec);
})();

</script>
